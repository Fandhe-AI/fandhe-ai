# OSS 直接比較ハーネス（scripts/bench/oss-gemm-compare/。イシュー #755）専用の
# cargo-deny 設定。本パッケージは本体 workspace（ルート Cargo.toml）の member では
# ないため、ルート `deny.toml`（`cargo tree --workspace` 相当のルート Cargo.lock を
# 走査対象とする）の監査範囲に含まれない。この監査欠落を埋めるため、本パッケージ
# 専用の Cargo.lock を対象に個別に `cargo deny --manifest-path
# scripts/bench/oss-gemm-compare/Cargo.toml --locked check licenses sources` を
# CI（.github/workflows/ci.yml の deps-forbidden ジョブ）から実行する
# （`docs/oss-comparison-harness-decision.md` 参照。ユーザー承認条件
# 「ライセンス監査を CI に組み込む」の実体）。
#
# advisories・bans はルート `deny.toml` と異なりここでは検査対象に含めない
# （本パッケージはユーザー承認で「本体 workspace 外限定」の性質を持つ bench
# 専用ツールであり、承認条件はライセンス監査の CI 組み込みに限定されるため）。
# ライセンス許可リスト・sources 制約はルート `deny.toml` と同一方針にする。

[licenses]
version = 2
include-dev = true
# allow はルート `deny.toml` の [licenses] allow と同一リスト（本パッケージの
# Cargo.lock 実測でこの範囲内に収まることを cargo deny check licenses で確認する。
# 変更する場合はルート deny.toml・docs/license-matrix.md との整合をユーザー承認の
# うえで確認する）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
]
confidence-threshold = 0.8

[sources]
# 全依存が crates.io 由来であることを要求する（ルート `deny.toml` と同一方針。
# サプライチェーン観点で git 依存・代替レジストリの混入を fail-closed 検出する）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
