[package]
name = "bench-fandhe"
version = "0.1.0"
edition = "2024"
# 本リポジトリと同一のデュアルライセンス。cargo-deny（licenses）の unlicensed 検出を
# 明示宣言で解消する（scripts/bench/framework-compare/deny.toml）
license = "MIT OR Apache-2.0"
# ベンチ専用ツール（crates.io へ公開しない）。publish = false により cargo-deny の
# wildcards 検査で path 依存（bench-common）が allow-wildcard-paths の対象になる
publish = false

[dependencies]
bench-common = { path = "../bench-common" }
# deps-policy.md（第 9 区分の適用範囲拡張。本 workspace 限定）に合わせ =x.y.z 完全固定
fandhe-ai = "=0.8.0"

# イシュー #1353: `--managed`（CUDA managed memory 配置）の実計測結線用。
# `set_cuda_managed_memory_enabled` API は `fandhe-ai =0.8.0`（#1487 で
# ピン更新）で収録済み。feature 分岐自体は既定 OFF のまま維持し（挙動
# 変更は本イシューのスコープ外）、有効化する場合は `run_ab_managed_cuda.sh`
# の HEAD ソース計測が主目的のため引き続き `[patch.crates-io.fandhe-ai]`
# の path patch を併用する（README「`--managed`」節参照）。
[features]
managed-placement = []

# イシュー #1337・#1438: `readout_var`（`Var::to_tensor()` + `.to_vec()`
# の host_copy memcpy）を借用ビュー（`fandhe_ai::VarHostView`/
# `Tensor::host_slice`）へ切り替える経路は #1438 で bench-fandhe の
# 既定経路へ取り込み、旧計測専用 cargo feature（既定 OFF・#1337 で導入）は
# 撤去した。`Var::host_view`/`VarHostView`/`Tensor::host_slice` API は
# `fandhe-ai =0.8.0`（#1487 でピン更新）で収録済みのため、registry
# 解決のまま既定ビルドが成立する（path patch は不要になった。旧
# `bench_fandhe_pin_guard.sh` の未指定検知ガードは #1487 で撤去済み）。

# イシュー #1339: `--device-checksum`（GEMM checksum をバックエンド側
# `f64` reduction で求め読み戻しを 8 バイトへ縮小する経路）の実計測結線用。
# `Var::matmul_checksum`/`ChecksumReadout`/`GemmChecksum` API は
# `fandhe-ai =0.8.0`（#1487 でピン更新）で収録済み。feature 分岐自体は
# 既定 OFF のまま維持し（挙動変更は本イシューのスコープ外）、有効化する
# 場合は `managed-placement` と同じく `[patch.crates-io.fandhe-ai]` で
# `crates/facade` への path patch を CLI `--config` 経由で併用する前提
# （README「`--device-checksum`」節参照）。
device-checksum = []

# イシュー #1350: `--graph <on|stream-only>`（学習 step の CUDA Graph
# capture 経路。#1349）の実計測結線用。`cuda_graph_step_mode`/
# `cuda_graph_step_stats` API は `fandhe-ai =0.8.0`（#1487 でピン更新）で
# 収録済み。feature 分岐自体は既定 OFF のまま維持し（挙動変更は本
# イシューのスコープ外）、有効化する場合は `managed-placement` と同じく
# `[patch.crates-io.fandhe-ai]` で `crates/facade` への path patch を
# CLI `--config` 経由で併用する前提（README「`--graph`」節・
# `run_ab_graph_cuda.sh` 参照）。
graph-step = []
