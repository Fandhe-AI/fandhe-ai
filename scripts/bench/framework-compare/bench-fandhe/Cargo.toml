[package]
name = "bench-fandhe"
version = "0.1.0"
edition = "2024"
# 本リポジトリと同一のデュアルライセンス。cargo-deny（licenses）の unlicensed 検出を
# 明示宣言で解消する（scripts/bench/framework-compare/deny.toml）
license = "MIT OR Apache-2.0"
# ベンチ専用ツール（crates.io へ公開しない）。publish = false により cargo-deny の
# wildcards 検査で path 依存（bench-common）が allow-wildcard-paths の対象になる
publish = false

[dependencies]
bench-common = { path = "../bench-common" }
# deps-policy.md（第 9 区分の適用範囲拡張。本 workspace 限定）に合わせ =x.y.z 完全固定
fandhe-ai = "=0.7.0"

# イシュー #1353: `--managed`（CUDA managed memory 配置）の実計測結線用。
# crates.io 公開版 `fandhe-ai =0.7.0` には `set_cuda_managed_memory_enabled`
# API が未収録（#1352・未リリースの HEAD で追加）のため、既定ビルド
# （feature 無効）ではこの feature 配下のコードはコンパイルされず
# `=0.7.0` ピンのままビルド可能である。有効化する場合は
# `[patch.crates-io.fandhe-ai]` で `crates/facade` への path patch を
# 併用する前提（README「`--managed`」節・`run_ab_managed_cuda.sh` 参照）。
[features]
managed-placement = []

# イシュー #1337: `readout_var`（`Var::to_tensor()` + `.to_vec()` の
# host_copy memcpy）を借用ビュー（`fandhe_ai::VarHostView`/
# `Tensor::host_slice`）へ切り替える計測専用 feature（既定 OFF）。
# crates.io 公開版 `fandhe-ai =0.7.0` には `Var::host_view`/
# `VarHostView`/`Tensor::host_slice` API が未収録（#1335・#1336 は
# 未リリースの HEAD で追加）のため、既定ビルド（feature 無効）では
# `HostReadout` 型・呼び出しは `Vec<f32>` 経路のままコンパイルされ
# `=0.7.0` ピンのままビルド可能である。有効化する場合は
# `managed-placement` と同じく `[patch.crates-io.fandhe-ai]` で
# `crates/facade` への path patch を CLI `--config` 経由で併用する
# 前提（README「借用ビュー readout（#1337）」節参照）。
host-view-readout = []
