[package]
name = "bench-fandhe"
version = "0.1.0"
edition = "2024"
# 本リポジトリと同一のデュアルライセンス。cargo-deny（licenses）の unlicensed 検出を
# 明示宣言で解消する（scripts/bench/framework-compare/deny.toml）
license = "MIT OR Apache-2.0"
# ベンチ専用ツール（crates.io へ公開しない）。publish = false により cargo-deny の
# wildcards 検査で path 依存（bench-common）が allow-wildcard-paths の対象になる
publish = false

[dependencies]
bench-common = { path = "../bench-common" }
# deps-policy.md（第 9 区分の適用範囲拡張。本 workspace 限定）に合わせ =x.y.z 完全固定
fandhe-ai = "=0.7.0"

# イシュー #1353: `--managed`（CUDA managed memory 配置）の実計測結線用。
# crates.io 公開版 `fandhe-ai =0.7.0` には `set_cuda_managed_memory_enabled`
# API が未収録（#1352・未リリースの HEAD で追加）のため、既定ビルド
# （feature 無効）ではこの feature 配下のコードはコンパイルされず
# `=0.7.0` ピンのままビルド可能である。有効化する場合は
# `[patch.crates-io.fandhe-ai]` で `crates/facade` への path patch を
# 併用する前提（README「`--managed`」節・`run_ab_managed_cuda.sh` 参照）。
[features]
managed-placement = []

# イシュー #1337・#1438: `readout_var`（`Var::to_tensor()` + `.to_vec()`
# の host_copy memcpy）を借用ビュー（`fandhe_ai::VarHostView`/
# `Tensor::host_slice`）へ切り替える経路は #1438 で bench-fandhe の
# 既定経路へ取り込み、旧計測専用 cargo feature（既定 OFF・#1337 で導入）は
# 撤去した。crates.io 公開版 `fandhe-ai =0.7.0` には `Var::host_view`/
# `VarHostView`/`Tensor::host_slice` API が未収録（#1335・#1336 は
# 未リリースの HEAD で追加）のため、ピン未更新の間は registry 解決
# ビルドが構造的に不可能になった。`managed-placement` と同じく
# `[patch.crates-io.fandhe-ai]` で `crates/facade` への path patch を
# CLI `--config` 経由で併用する前提（README「借用ビュー readout
# （既定経路）」節参照。`bench_fandhe_pin_guard.sh` が未指定時を
# fail-closed で検知する）。

# イシュー #1339: `--device-checksum`（GEMM checksum をバックエンド側
# `f64` reduction で求め読み戻しを 8 バイトへ縮小する経路）の実計測結線用。
# crates.io 公開版 `fandhe-ai =0.7.0` には `Var::matmul_checksum`/
# `ChecksumReadout`/`GemmChecksum` API が未収録（本イシューは未リリースの
# HEAD で追加）のため、既定ビルド（feature 無効）ではこの feature 配下の
# コードはコンパイルされず `=0.7.0` ピンのままビルド可能である。有効化する
# 場合は `managed-placement` と同じく `[patch.crates-io.fandhe-ai]` で
# `crates/facade` への path patch を CLI `--config` 経由で併用する前提
# （README「`--device-checksum`」節参照）。
device-checksum = []

# イシュー #1350: `--graph <on|stream-only>`（学習 step の CUDA Graph
# capture 経路。#1349）の実計測結線用。crates.io 公開版
# `fandhe-ai =0.7.0` には `cuda_graph_step_mode`/`cuda_graph_step_stats`
# API が未収録（#1349 は未リリースの HEAD で追加）のため、既定ビルド
# （feature 無効）ではこの feature 配下のコードはコンパイルされず
# `=0.7.0` ピンのままビルド可能である。有効化する場合は
# `managed-placement` と同じく `[patch.crates-io.fandhe-ai]` で
# `crates/facade` への path patch を CLI `--config` 経由で併用する前提
# （README「`--graph`」節・`run_ab_graph_cuda.sh` 参照）。
graph-step = []
