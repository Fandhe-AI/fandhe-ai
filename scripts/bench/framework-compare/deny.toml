# フレームワーク横並びベンチ（scripts/bench/framework-compare/。許容依存第 9 区分の
# 適用範囲拡張。PR #915）専用の cargo-deny 設定。本 workspace は本体 workspace
# （ルート Cargo.toml）の member ではないため、ルート `deny.toml` の監査範囲に
# 含まれない。この監査欠落を埋めるため、本 workspace 専用の Cargo.lock を対象に
# `cargo deny --manifest-path scripts/bench/framework-compare/Cargo.toml --locked
# check --config scripts/bench/framework-compare/deny.toml advisories bans licenses
# sources` を CI（.github/workflows/ci.yml の deps-forbidden ジョブ）から実行する
# （scripts/bench/oss-gemm-compare/deny.toml と同一方式。
# `docs/framework-compare-harness-decision.md` 参照）。
#
# 本 workspace は比較対象（burn =0.21.0・candle-core =0.11.0）の大規模な推移的
# 依存ツリーを持つベンチ専用ツールであり、全クレート `publish = false`・成果物を
# 配布しない（バイナリはローカル計測にのみ使う）。この位置づけを前提に、
# ルート `deny.toml` の allow リストへ 3 ライセンスを追加している（下の
# [licenses] コメント参照。2026-08-28 ユーザー承認: PR #915 導入指示）。
# 本体 workspace のライセンス方針（ルート deny.toml・docs/license-matrix.md）は
# 変更しない。

[advisories]
# RUSTSEC アドバイザリ監査（ルート `deny.toml` の [advisories] と同一方針）。
version = 2
ignore = [
    # RUSTSEC-2025-0141: `bincode` 2.0.1 が unmaintained（開発恒久停止の情報提供型
    # アドバイザリであり脆弱性ではない）。比較対象 `burn =0.21.0` の推移的依存で
    # あり、burn 側が bincode 依存を解消した新版へは比較条件（=x.y.z 完全固定・
    # 実測記録済みバージョン）を崩さない限り更新できない。ベンチ専用・非配布の
    # ツリーであるため受容する（2026-08-28 ユーザー承認: PR #915 導入指示）。
    # 解消予定: 比較対象バージョンを更新する再計測キャンペーン時に要否を再評価する。
    "RUSTSEC-2025-0141",
    # RUSTSEC-2024-0436: `paste`（手続き型マクロ crate）が unmaintained（情報提供型
    # アドバイザリであり脆弱性ではない）。比較対象の推移的依存（macerator・pulp・
    # tokenizers 経由）で、oss-gemm-compare/deny.toml の同 ignore と同一の判断
    # （アップグレード先なし・ベンチ専用ツリーで受容。2026-08-28 ユーザー承認:
    # PR #915 導入指示）。
    "RUSTSEC-2024-0436",
    # zip 9.0.0 未満の展開（extract）API に関する 3 勧告（修正版 >= 9.0.0）。勧告 ID は
    # 版を問わず効く。ID ごとの内容は次のとおりで、各 ID の理由・到達性の根拠・失効条件は
    # いずれも下記の共通節（理由／到達性の根拠 A〜E／失効条件）に従う（2026-10-17
    # ユーザー承認。出典: https://github.com/Fandhe-AI/fandhe-ai/pull/3410#issuecomment-6232331383
    # 。ベンチ専用・非配布のツリーのため受容。本体のルート `deny.toml` には追加しない）。
    #   - RUSTSEC-2026-0367: ZIP 展開時に SUID/SGID/sticky ビットを安全な権限へ
    #     マスクせず保持する（`ZipArchive::extract`／ストリーム展開 API）。共通節を参照。
    #   - RUSTSEC-2026-0368: `ZipArchive::extract` が、展開先ディレクトリの外を指す
    #     symlink を作成する（リンク先を検証しない）。共通節を参照。
    #   - RUSTSEC-2026-0369: `ZipStreamReader::extract`／`ZipArchive::extract` が
    #     symlink 越しに Unix 権限を適用する（リンク先が展開先内に収まるか未検証）。
    #     共通節を参照。
    # 理由（共通）: 解決グラフに入る zip は `zip 8.6.0` だけで、比較対象
    # `candle-core =0.11.0` の推移的依存。修正版 >= 9.0.0 へは比較対象の完全固定版を
    # 変えない限り更新できない。
    # 到達性の根拠（共通。いずれも勧告対象の展開 API を呼ばない。リポジトリルート基準。
    # 事前に `cargo fetch --manifest-path scripts/bench/framework-compare/Cargo.toml --locked`
    # （またはビルド）で依存ソースを取得しておくこと。2026-10-17 に A〜E を実行して確認）:
    #   0. C="$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/candle-core-0.11.0/src)"
    #      → 1 件のパスが出ること（出なければ B・C は偽陰性になるため先に失敗させる）。
    #   A. grep -rnE '\bzip::|use zip|ZipArchive|ZipStreamReader|\.extract[_(]|::extract[_(]|^zip\b' \
    #        scripts/bench/framework-compare/bench-*/ --include='*.rs' --include=Cargo.toml
    #      → 出力なし（終了コード 1）。ハーネスは zip を直接依存にも使用にも持たない。
    #   B. grep -rnE '\.extract[_(]|::extract[_(]|ZipStreamReader' "$C"
    #      → 出力なし（終了コード 1）。`extract_unwrapped_root_dir(` 等も含め展開 API の
    #        呼び出しはない。
    #   C. grep -rnE 'zip::|ZipArchive|ZipWriter' "$C" \
    #        | grep -vE 'ZipArchive::new|ZipWriter::new|zip::(write::FileOptions|CompressionMethod|result::ZipError)'
    #      → 出力なし（パイプ末尾の grep -v の終了コード 1 が期待値。0. が成功していること
    #        が前提）。除外せずに実行すると zip の利用は error.rs・npy.rs・pickle.rs の
    #        `ZipArchive::new`／`ZipWriter::new` と関連型だけ。
    #   D. cargo tree --manifest-path scripts/bench/framework-compare/Cargo.toml --offline --locked -i zip@7.2.0
    #      → `nothing to print`（解決グラフに入らない。burn-candle 由来は無効 feature 側）。
    #   E. cargo tree --manifest-path scripts/bench/framework-compare/Cargo.toml --offline --locked -i zip@0.6.6
    #      → `nothing to print`（同。burn-tch 由来は無効 feature 側）。
    #      なお `-i zip@8.6.0` は candle-core 0.11.0（bench-candle 経由）だけを示す。
    #   入力は自前生成のテンソルと safetensors のみで、外部の ZIP を展開しない。
    # 失効条件: zip の修正版（>= 9.0.0）が candle-core の要求範囲に入った時点、または
    # 比較対象（candle-core・burn）のピン更新時に、この 3 件の ignore を削除する。
    # zip の版集合（0.6.6／7.2.0／8.6.0）は `scripts/check-forbidden-deps.sh lock-all` が
    # Cargo.lock に対し fail-closed で固定する（版の追加・変更・非 registry 化は CI で失敗。
    # 別の版が入ったら ignore を足さず承認を取り直す）。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
include-dev = true
# 先頭 9 件はルート `deny.toml` の [licenses] allow と同一リスト。うち
# `CDLA-Permissive-2.0` は `webpki-root-certs`（fandhe-ai 0.12.0 の facade →
# ureq/native-tls 経由の推移的依存。ルートと同じ第 11 区分の監査済み版）用に
# ルートを写したもので、本 workspace 限定の追加ではない（2026-10-27 所有者承認:
# #3271 issuecomment-6426224103）。
# 末尾 3 件（MPL-2.0・CC0-1.0・BSL-1.0）は本 workspace 限定の追加（cargo deny の
# 実測で比較対象の推移的依存に含まれることを確認済み。ベンチ専用・非配布のため
# 受容する。2026-08-28 ユーザー承認: PR #915 導入指示。本体側のルート deny.toml
# には追加しない）:
#   - MPL-2.0: `colored`（burn 経由）・`option-ext`（dirs 経由）。ファイル単位の
#     弱いコピーレフト。ソース改変・再配布を行わないベンチ実行のみの利用
#   - CC0-1.0: `hexf-parse`・`tiny-keccak`（wgpu / cubecl 経由）。パブリックドメイン相当
#   - BSL-1.0: `xxhash-rust`（burn 経由）。Boost Software License（permissive）
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[sources]
# 全依存が crates.io 由来であることを要求する（ルート `deny.toml` と同一方針）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 依存禁止リスト（.claude/rules/deps-policy.md）は本 workspace には適用しない
# （比較対象として意図的に含む）。代わりに scripts/check-forbidden-deps.sh lock-all の
# 専用契約検査（[workspace] 隔離・承認済みピンのドリフト検出）が別途 fail-closed で
# 走る。ここでは oss-gemm-compare/deny.toml と同一方針の重複バージョン・
# ワイルドカード監査のみ行う。
multiple-versions = "warn"
# バージョン要求 `*` の依存宣言を拒否する（`=x.y.z` 完全固定方針）。bench-* の
# path 依存（bench-common）は全クレート `publish = false` のため
# allow-wildcard-paths の対象になり許容される。
wildcards = "deny"
allow-wildcard-paths = true
