# scripts/check-workflow-runner-policy.sh self-test 用の違反 fixture（イシュー #472）。
# self-hosted という語は含まないが、許容形リスト（ubuntu-latest・macos-latest・
# windows-latest のいずれとも完全一致しない）以外の runner 宣言を含むため「許容形検査」
# で fail するはず（larger runner 名・バージョン固定ラベル・ブロックシーケンス形式・
# 式展開・キー表記の等価系のいずれも許容形と一致しない）。
name: dummy

jobs:
  larger-runner:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 5

  block-sequence-runner:
    runs-on:
      - custom-legacy-label
    timeout-minutes: 5

  expression-runner:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5

  # 引用キー・コロン前空白（YAML デコード後はいずれも同じ mapping key `runs-on`。
  # イシュー #472 P1 codex-review 指摘）で larger runner を宣言する迂回パターン。
  quoted-key-bypass:
    "runs-on": ubuntu-latest-8-cores
    timeout-minutes: 5

  space-before-colon-bypass:
    runs-on : ubuntu-latest-8-cores
    timeout-minutes: 5

  # `\x2D` は YAML double-quoted scalar のエスケープとしてハイフンにデコードされる
  # （イシュー #472 P0 codex-review 指摘）。字面に `runs-on` という部分文字列が
  # 現れなくても、デコード後のキーは runs-on になるため検出され fail するはず。
  escaped-hex-key-bypass:
    "runs\x2Don": ubuntu-latest-8-cores
    timeout-minutes: 5

  # バージョン固定ラベルは意図的に許容形集合へ含めていない（scripts/
  # check-workflow-runner-policy.py の ALLOWED_RUNNER_VALUES コメント参照）。
  # 追加が必要になった時点でのレビュー必須な明示的拡張であることを、この
  # fixture で fail 側に固定して検証する。
  versioned-label-not-allowed:
    runs-on: macos-14
    timeout-minutes: 5
