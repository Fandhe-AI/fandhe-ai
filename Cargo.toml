# fandhe-ai の workspace ルート定義。
#
# Burn 依存を排した完全自作コア方針（REQ-1 v2。.claude/rules/coding-rust.md）に基づき、
# tensor-core・autodiff・backend-cpu/cuda/metal・onnx-interop・guardrail・self-repair・
# bench-harness・facade の 10 クレート（+ 開発ツール docs-site）を member として明示列挙する（意図しないクレート
# 混入防止のため glob は使わない）。TASK-1.1（docs/spec/05-tasks.md）の骨格作成に対応する。
# facade は TASK-9.3（イシュー #410・spec 確定は fandhe-ai-spec#52）で追加した
# composition root・compat 公開面クレート。
#
# docs-site（11 個目・イシュー #868/#869）は GitHub Pages 公開ツリー（#865 Phase 1）
# 向けの開発者・CI 専用ツール（`publish = false`。本体ライブラリの公開 API とは無関係）。
# 外部依存ゼロの自作 SSG（nav.toml パーサー + CLI）であり [workspace.dependencies] へは
# 一切影響しない。
#
# 許容依存 8 区分（.claude/rules/deps-policy.md）は下記 [workspace.dependencies] で
# =x.y.z 完全固定として一元導入済み（TASK-1.1b・イシュー #5）。8 区分以外の新規追加・
# 既存依存のバージョン更新は本ファイルで行わず、ユーザー承認を経た別イシューで対応する。
#
# バックエンド切替は feature フラグなしの cfg ベース構成（PoC-v2-5 実証構成。REQ-2）を
# ライブラリの正式な切替機構として採用する（TASK-2.1a・イシュー #49）。`cudarc`（CUDA）は
# 無条件依存＋動的ロード方式（`crates/backend-cuda/Cargo.toml`）、`objc2` 系（Metal）は
# `[target.'cfg(target_os = "macos")'.dependencies]`（`crates/backend-metal/Cargo.toml`）で
# 非 macOS ビルドから除外する。cfg 分岐は各クレートの Cargo.toml に閉じ、本ファイルの
# 依存バージョン・feature 指定自体は変更しない（PoC-v2-5 突合済み・機能フラグなし）。

[workspace]
resolver = "3"
members = [
    "crates/tensor-core",
    "crates/autodiff",
    "crates/backend-cpu",
    "crates/backend-cuda",
    "crates/backend-metal",
    "crates/onnx-interop",
    "crates/guardrail",
    "crates/self-repair",
    "crates/bench-harness",
    "crates/facade",
    "crates/docs-site",
]

[workspace.package]
# PR #359 codex-review 指摘 P1: TASK-14.1a（#174）で `backend-cpu::CpuMemory`
# の公開 API を破壊的変更（unit struct・Copy → フィールド付き struct・Clone。
# `crates/backend-cpu/src/lib.rs` の移行手引き参照）したため、Cargo SemVer の
# 0.x 系ルール（0.x では breaking change は minor 桁を上げる）に従い
# 0.1.0 → 0.2.0 とする。ワークスペース全 9 クレートが `version.workspace = true`
# を参照するため足並みを揃える（各クレート間の内部依存はいずれも
# バージョン指定なしの `path = ...` のため、本バンプ自体は他クレートの
# 依存解決に影響しない）。
#
# PR #362 codex-review 指摘 P1: TASK-#201 で `tensor-core::BufferHandle`
# （公開 trait）に必須メソッド `as_any_mut` を追加したのも同様に SemVer 上の
# 破壊的変更（既定実装を用意しコンパイル breakage 自体は回避したが、
# 既定実装のままだとプール経由利用時に panic するため利用者へ告知が必要。
# `crates/tensor-core/src/buffer.rs::BufferHandle::as_any_mut` のドキュメント
# コメント参照）。0.x 系ルールに従い 0.2.0 → 0.3.0 とする。
#
# イシュー #1011/#1083: CUDA 都度同期廃止（#1064）・TF32 opt-in API（#1042）等、
# 公開 API の追加・実行モデル変更を伴うため 0.x 系ルールに従い
# 0.4.0 → 0.5.0 とする。内部依存の `version = "=0.5.0"` 併記は
# `docs/crates-io-publishing-order.md` §4「版数運用: `workspace.version` に
# よる lockstep」を参照。
#
# イシュー #1007: 0.5.0 公開（2026-08-31）以降の改善（#1108 Metal 選択テーブル・
# #1110 Metal SGD バッチング・#1111 CUDA variant selection 修正・#1113〜#1116 の
# GB10 実機修正）を含めて crates.io へ公開するため 0.5.0 → 0.6.0 とする。
#
# イシュー #1185: 0.6.0 公開（2026-09-02）以降の改善（#1164 CUDA cp.async 多段
# パイプライン結線・#1208 CudaGemmAuto f16 経路の mma 優先本番有効化・#1167 Metal
# 転置タイル variant・#1174 CPU GEMM 再チューニング結線・#1211〜#1219 の学習・推論
# 固定費改善）を含めて crates.io へ公開し、framework-compare の正式系列ゲートを
# `fandhe-ai =0.7.0` で再判定するため 0.6.0 → 0.7.0 とする。
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# crates.io 公開メタデータ（イシュー #880。PR #892 は #891 rename 前の main を
# base にしていたためコンフリクトし、origin/main から作り直した。publish フラグの
# per-crate 制御・path 依存への version 付与・per-crate README は #891〜#894 で
# 既に main へ反映済みのため、本 PR の残差分はここ〈repository〉と各公開クレートの
# keywords / categories / description のみ）。
repository = "https://github.com/Fandhe-AI/fandhe-ai"

# 許容依存 8 区分（.claude/rules/deps-policy.md）を =x.y.z 完全固定で一元定義する。
# 各クレートは `<name>.workspace = true` で参照し、バージョン更新はこのテーブルのみを
# 変更すれば全クレートに反映される（TASK-1.1b。イシュー #5）。
#
# バージョン選定方針: PoC-v2 実測構成（docs/spec/03-poc/）と同一版を採用し、
# crates.io 最新 stable が PoC 実測系列と同一マイナー系列ならその最新 patch を採用する。
# マイナー／メジャーが進んでいる場合は PoC 実測版に安全側で固定する（本テーブルの
# safetensors がこれに該当。詳細は各行のコメントを参照）。
#
# `default-features = false` は inherited dependency では member 側の指定が無視されるため
# （member 側で再指定すると warning）、ここ（workspace 側）で確定する。
[workspace.dependencies]
# CUDA バックエンド（REQ-2）。無条件依存＋動的ロード方式（`dynamic-loading` feature）で
# CUDA toolkit 非搭載環境でもビルドが成立する（PoC-v2-3 で実証済み。
# docs/spec/03-poc/poc-v2-3-cuda-gemm/code/rust/Cargo.toml:26-32）。
# `cuda-13000`（DGX Spark GB10 実機の CUDA 13.0 に合わせた API バージョン feature）は
# cudarc の CUDA API バージョン feature の指定が必須でありビルドできないため、
# PoC-v2-3・PoC-v2-5 実測構成（docs/spec/03-poc/poc-v2-5-backend-numeric-parity/code/rust/Cargo.toml:36-42）
# を踏襲して採用する。deps-policy.md の記載条件（driver／nvrtc／dynamic-loading／cuda-13000／f16）
# に反映済み（イシュー #412 でユーザー承認。ライセンス実測は docs/license-matrix.md 4 節）。
cudarc = { version = "=0.19.8", default-features = false, features = [
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13000",
    "f16",
] }
# Metal バックエンド（REQ-2）。`cfg(target_os = "macos")` 限定（deps-policy.md）。
# バージョンは PoC-v2-5 実測構成と同一（docs/spec/03-poc/poc-v2-5-backend-numeric-parity/code/rust/Cargo.toml:50-52）。
# ライセンス: objc2-metal のみ Zlib OR Apache-2.0 OR MIT の三重ライセンス（deps-policy.md 記載どおり）。
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-metal = "=0.3.2"
# ONNX / safetensors 相互運用（REQ-7）。ワイヤフォーマット処理のみに使用し、
# テンソルへのマッピングは自作する（deps-policy.md）。
# PoC-v2-6 実測は "0.7"（docs/spec/03-poc/poc-v2-6-interop/code/rust/Cargo.toml:32）。
# crates.io 最新は 0.8.0 だが PoC 実測系列（0.7 系。最新 patch は 0.7.0 のみ存在）から
# マイナーが進んでいるため、安全側で PoC 実測系列に固定する（更新は別イシューで提案）。
safetensors = "=0.7.0"
# ONNX の protobuf デコードのみに使用する。生成コードは protoc 非依存で手書きし、
# `prost-build`（protoc ビルド時依存）は使わない（deps-policy.md・PoC-v2-6）。
# PoC-v2-6 実測は "0.14"（docs/spec/03-poc/poc-v2-6-interop/code/rust/Cargo.toml:35）。
# 同一マイナー系列の最新 patch（0.14.4）を採用する。
prost = "=0.14.4"
# 構造化データのシリアライズ（guardrail・self-repair の設定・判定レポート JSON 等）。
# PoC-v2-6 実測は "1"（derive feature）。同一メジャー系列の最新 patch を採用する。
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# CPU 並列カーネル（REQ-2）。PoC-v2-1 で naive/blocked 比 約 6〜8.5 倍改善を実測
# （docs/spec/03-poc/poc-v2-1-tensor-cpu-gemm/code/rust/Cargo.toml:21）。
# 同一メジャー系列の最新 patch を採用する。
rayon = "=1.12.0"
# f16 数値型。PoC-v2-3/v2-5 実測は "2"（docs/spec/03-poc/poc-v2-3-cuda-gemm/code/rust/Cargo.toml:21）。
# 同一メジャー系列の最新 patch を採用する。
half = "=2.7.1"
# ベンチ計測基盤（bench-harness）。dev-dependencies 限定（deps-policy.md）。
# PoC 未使用のため crates.io 最新 stable をそのまま採用する。
criterion = "=0.8.2"
