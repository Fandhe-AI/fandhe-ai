# Git hooks 定義（lefthook）。`make hooks`（lefthook install）で導入する。
#
# 方針（.claude/rules/git-hooks.md・conventional-commits.md・ci.md。Fandhe-AI/rust-ai-library-v1 と同一）:
# - フックの追加・変更時は .claude/rules/git-hooks.md の方針（時間予算・CI との役割分担・
#   判断手順）に従う。CI と重複する検査は原則置かない（例外は同ルールの「明示的な例外」節に列挙）
# - --no-verify によるスキップは禁止
# - Cargo.toml 未追加（M0 の TASK-1.1 で workspace 作成予定）の間、cargo 系ジョブは
#   スキップする（CI 側の detect ステップ判定と同一方針。ci.md 参照）
# - GitHub Actions（ci.yml の rust-ci・各固有ジョブ）が PR ごとに必ず実行するチェック
#   （clippy・test 等）はローカルフックで重複実行しない。pre-push の clippy・test は
#   1 回の push に 7〜13 分かかり開発速度を落としていたため廃止した（2026-10-11 所有者指示）。
#   手元で CI 相当を確認したい場合は `make ci` を使う
# - フックには「1 秒未満で終わる」または「push 後では手遅れ／CI で検査していない」ものだけを
#   置く: staged の rustfmt 検査（CI 往復の差し戻しを避ける軽量ガード）・秘密情報ファイルの
#   stage 拒否（push 後では漏えいを取り消せない）・Conventional Commits 検証（CI 未検査）

pre-commit:
  parallel: true
  jobs:
    # staged の .rs のみ rustfmt --check（整形は make fmt / PostToolUse フックで実施済みの想定）。
    # rustfmt 単体は Cargo.toml を読まず既定 edition 2015 で検査してしまうため、
    # workspace の正である Cargo.toml の edition を明示指定する
    # （v1 イシュー #265 の教訓: 未指定時の import 並び順差異・再帰整形）
    - name: rustfmt-check
      glob: "*.rs"
      run: |
        if [ -f Cargo.toml ] && command -v rustfmt >/dev/null 2>&1; then
          ed=$(sed -n 's/^edition *= *"\([0-9]\{4\}\)".*/\1/p' Cargo.toml | head -n1)
          rustfmt --edition "${ed:-2021}" --check {staged_files}
        else
          echo "skip: Cargo.toml 未追加または rustfmt 未導入"
        fi

    # 秘密情報の混入検査（.claude/rules/security.md）。.env 系ファイルの stage を拒否する
    - name: secrets-guard
      run: |
        for f in {staged_files}; do
          case "$f" in
            *.env|.env.*|*.pem|*.key)
              echo "NG: 秘密情報ファイルがステージされています: $f" >&2
              exit 1
              ;;
          esac
        done

commit-msg:
  jobs:
    # Conventional Commits 形式の検証（.claude/rules/conventional-commits.md）。
    # Merge / Revert / fixup コミットは対象外とする
    - name: conventional-commits
      run: |
        msg="$(head -n1 {1})"
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$msg" | grep -qE '^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([^)]+\))?!?: .+'; then
          echo "NG: Conventional Commits 形式ではありません: $msg" >&2
          echo "形式: <type>(<scope>): <説明>  （type: feat|fix|perf|refactor|test|docs|build|ci|chore）" >&2
          exit 1
        fi
