# サイトナビゲーション定義（イシュー #874・親 #873。自作 SSG `crates/docs-site`
# 〈親イシュー #865〉が読み込むスキーマ）。
#
# スキーマは同型リポ fandhe-backend の `site/nav.toml` に合わせて記述
# （`[site]` title/base_path・`[[section]]` title/index_path・
# `[[section.page]]` title/source/path の 3 段構成。`path` は `base_path` を
# 含まない base-relative な値）。現在は `crates/docs-site` が本ファイルを読み込み
# GitHub Pages（https://fandhe-ai.github.io/fandhe-ai/）を生成している。
#
# セクション順（Getting Started → Guides → Examples → API Reference）で
# 4 セクション全てを宣言する。Getting Started・API Reference は #874
# （PR #887）が追加し、中間の Guides・Examples は #875 が追加した
# （親 #873 の受け入れ条件「4 セクションすべてに 1 ページ以上の原稿が
# ある」を本ファイルの充足で満たす）。

[site]
title = "fandhe-ai"
base_path = "/fandhe-ai"

[[section]]
title = "Getting Started"
index_path = "/"

[[section.page]]
title = "Home"
source = "site/index.md"
path = "/"

[[section.page]]
title = "Getting Started"
source = "site/getting-started.md"
path = "/getting-started/"

[[section]]
title = "Guides"
index_path = "/guides/"

[[section.page]]
title = "Guides"
source = "site/guides.md"
path = "/guides/"

[[section.page]]
title = "バックエンド構成"
source = "site/guides/backends.md"
path = "/guides/backends/"

[[section.page]]
title = "数値一致契約"
source = "site/guides/numerical-parity.md"
path = "/guides/numerical-parity/"

[[section.page]]
title = "性能の考え方"
source = "site/guides/performance.md"
path = "/guides/performance/"

[[section.page]]
title = "ONNX・safetensors 相互運用"
source = "site/guides/interop.md"
path = "/guides/interop/"

[[section]]
title = "Examples"
index_path = "/examples/"

[[section.page]]
title = "Examples"
source = "site/examples.md"
path = "/examples/"

[[section.page]]
title = "学習ループ"
source = "site/examples/training-loop.md"
path = "/examples/training-loop/"

[[section.page]]
title = "推論"
source = "site/examples/inference.md"
path = "/examples/inference/"

[[section.page]]
title = "GEMM ベンチ"
source = "site/examples/gemm-bench.md"
path = "/examples/gemm-bench/"

[[section]]
title = "API Reference"
index_path = "/api/"

[[section.page]]
title = "API Reference"
source = "site/api.md"
path = "/api/"

[[section.page]]
title = "compat API"
source = "site/api/compat.md"
path = "/api/compat/"

[[section.page]]
title = "guardrail / self-repair CLI"
source = "site/api/cli.md"
path = "/api/cli/"
