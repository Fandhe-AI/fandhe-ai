[package]
name = "onnx-interop"
description = "ONNX / safetensors 相互運用（REQ-7）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ワイヤフォーマット処理のみに使用し、テンソルへのマッピングは自作する（REQ-7・deps-policy.md）。
safetensors.workspace = true
# ONNX の protobuf デコードのみに使用する。生成コードは protoc 非依存で手書きし、
# prost-build（protoc ビルド時依存）は使わない（PoC-v2-6）。
prost.workspace = true
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu` が同種の判断を行った先例:
# crates/backend-cpu/Cargo.toml）。safetensors パース結果のマッピング先である
# `Tensor<f32>`・転置 API `transpose_2d()`・shape 検査 `ShapeError`（#73・TASK-7.1a）に加え、
# 8 オペ（Gemm/Relu/Sigmoid/Shape/Gather/Unsqueeze/Concat/Slice。TASK-7.2c）・MVP 算術オペ
# （Add/Mul/Div/Mod/Sqrt/Constant。TASK-7.3a）・MVP 形状操作オペ（Cast/Reshape/Squeeze/
# Transpose。TASK-7.3b）が入出力とする `Tensor<f32>`・stride ベース view API を利用するために
# 必要。
fandhe-ai-tensor-core = { path = "../tensor-core" }
# 数値型区分の許容依存（deps-policy.md）。workspace には既に固定済みで
# `tensor-core`/`backend-cpu` 等が使用中のため新規追加ではない。`onnx-interop` では
# `Cast(to=FLOAT16)`（イシュー #274）が `half::f16` を直接生成するために必要。
half.workspace = true

[dev-dependencies]
# 参照値 JSON（`tests/fixtures/pytorch-reference/st_reference.json`・
# `weight_shapes.json`）の読込に使う。`serde`/`serde_json` は workspace で
# 固定済みの許容依存（deps-policy.md）であり、参照するのみで新規外部依存の
# 追加ではない（`bench-harness` が #29 で行った同種の判断の先例）。
serde.workspace = true
serde_json.workspace = true
# #198: `tests/st_checkpoint.rs` が学習途中状態のチェックポイント検証
# （`autodiff::nn::Linear`/`Tape`/`autodiff::optim::Sgd` を経由した学習
# ループ）に使う。ユーザー承認不要（外部依存の新規追加ではない。workspace
# member 間の path 依存であり、`crates/autodiff/Cargo.toml` の
# bench-harness dev-dependency と同種の判断。deps-policy.md のユーザー
# 承認フロー対象外）。
fandhe-ai-autodiff = { path = "../autodiff" }
# #198: 学習データの決定的シード生成（`bench_harness::rng::Xorshift64Star`）
# に使う。`crates/autodiff/tests/nn_train_convergence.rs` と同一の先例
# （dev-dependency 経由の再利用のみで新規外部依存の追加ではない）。
bench-harness = { path = "../bench-harness" }
# TASK-12.1d（#164）: `autodiff::Tape::new(ops)` の破壊的変更（ops 必須
# 化）に伴い、`tests/st_checkpoint.rs` が学習ループで使う `Tape` の
# 構築に `CpuBackendOps` を渡す必要がある。ユーザー承認不要（外部依存の
# 新規追加ではない。workspace 内 path 依存であり、上記 `autodiff`／
# `bench-harness` dev-dependency と同種の判断。deps-policy.md のユーザー
# 承認フロー対象外）。
fandhe-ai-backend-cpu = { path = "../backend-cpu" }
