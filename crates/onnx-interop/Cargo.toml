[package]
name = "onnx-interop"
description = "ONNX / safetensors 相互運用（REQ-7）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ワイヤフォーマット処理のみに使用し、テンソルへのマッピングは自作する（REQ-7・deps-policy.md）。
safetensors.workspace = true
# ONNX の protobuf デコードのみに使用する。生成コードは protoc 非依存で手書きし、
# prost-build（protoc ビルド時依存）は使わない（PoC-v2-6）。
prost.workspace = true
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。backend-cpu の tensor-core path 依存と
# 同種の判断）。8 オペ（Gemm/Relu/Sigmoid/Shape/Gather/Unsqueeze/Concat/Slice。TASK-7.2c）は
# いずれも `Tensor<f32>` を入出力とし、`ShapeError`／stride ベース view API を再利用する。
tensor-core = { path = "../tensor-core" }
