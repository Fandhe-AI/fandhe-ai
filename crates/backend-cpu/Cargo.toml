[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/backend-cpu`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_backend_cpu`。
name = "fandhe-ai-backend-cpu"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「CPU バックエンド（rayon 並列カーネル。REQ-2）」
description = "CPU backend (rayon-parallel kernels) for a from-scratch Rust AI/ML library"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の本クレートページに表示される readme（イシュー #882）。
# 「fandhe-ai 経由での利用が唯一のサポート面・本クレートへの直接依存は
# サポート対象外」を明示する per-crate 方式を採用（`crates/facade/Cargo.toml`
# の同コメント参照）。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords / categories の
# 制約・出典は `crates/facade/Cargo.toml` の同コメント参照。
keywords = ["cpu", "simd", "gemm", "machine-learning"]
categories = ["science", "mathematics", "hardware-support"]

[dependencies]
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない）。elementwise カーネルの入出力型
# `Tensor<f32>`・shape 検査 `elementwise_out_shape`（#22・TASK-1.6b）に加え、
# reduction カーネル（#23・TASK-1.6c）が `reduce_out_shape`（tensor-core::ops_shape）を
# 利用するために必要。
# `version` 併記の理由は `crates/autodiff/Cargo.toml` の同依存コメントを参照
# （crates.io 公開 6 クレート間 path 依存の公開要件。イシュー #881 で確定した
# 方針。`docs/crates-io-publishing-order.md`。workspace 公開バージョンと
# 完全一致させる）。
fandhe-ai-tensor-core = { path = "../tensor-core", version = "=0.5.0" }
# CPU 並列カーネル（REQ-2）。PoC-v2-1 実測（naive/blocked 比 約 6〜8.5 倍改善）に基づく採用。
rayon.workspace = true
half.workspace = true

[dev-dependencies]
# 決定的シード PRNG（`Xorshift64Star`）を GEMM カーネル数値一致テスト（tests/gemm_parity.rs）
# の入力生成に使う（coding-rust.md「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。workspace 内クレート同士の path 依存であり、許容依存 8 区分（外部クレート）の
# 新規追加には当たらない（`bench-harness` が serde を workspace 参照した #29 の先例と同種の判断）。
bench-harness = { path = "../bench-harness" }
# TASK-1.9a（#44）の受け入れ条件「3 バックエンドが同一 trait でデバイス列挙・選択できる」を
# `tests/device_provider_integration.rs` で直接検証するための dev 依存（公開依存グラフを
# 汚さない。上記 bench-harness と同種の判断）。CUDA は無条件依存のため全 OS で追加する。
# `version` を付けない理由（イシュー #881 で確定した dev-dependencies 方針。
# `docs/crates-io-publishing-order.md`）: `cargo publish` は dev-dependencies
# から path のみの依存を自動 strip するため、公開物には一切残らない。加えて
# 本依存は `backend-cpu ⇄ backend-cuda` の循環（backend-cuda 側の dev-dep で
# 本クレートへ依存）を成すため、version 併記のままだと初回 publish 時に
# 「registry 未存在バージョンへの依存」でブロックされうる。strip 方式に
# 統一することで公開順序の制約を `[dependencies]` のトポロジカル順のみに
# 単純化できる（非公開クレートの bench-harness 依存と同一規則）。
fandhe-ai-backend-cuda = { path = "../backend-cuda" }
# TASK-12.2a（#167）の融合効果実測ハーネス（`tests/fusion_effect_perf.rs`）が
# `autodiff::Tape` 経由の遅延評価（`push_lazy`／`materialize_*`）で融合条件・
# 非融合条件を within-harness 比較するための dev 依存。workspace 内クレート
# 同士の path 依存であり外部依存の新規追加ではない（上記 bench-harness・
# backend-cuda と同種の判断）。**逆方向は禁止**: `autodiff` → `backend-cpu` の
# 依存は `crates/autodiff/tests/architecture_boundaries.rs` が dev 依存も含め
# 機械検査しているため、本ハーネスは backend-cpu 側に置く。
# `version` を付けない理由は上記 `fandhe-ai-backend-cuda` dev-dependency
# コメント参照（イシュー #881・dev-dependencies は path-only strip 方針。
# `docs/crates-io-publishing-order.md`）。
fandhe-ai-autodiff = { path = "../autodiff" }

# Metal は `cfg(target_os = "macos")` 限定（deps-policy.md）。backend-metal クレート自体は
# 非 macOS でもビルド可能（本体が `#[cfg(target_os = "macos")]` で空になるだけ）だが、
# dev-dependency の追加自体も cfg で絞り不要な依存解決を避ける。
[target.'cfg(target_os = "macos")'.dev-dependencies]
# `version` を付けない理由は上記 `fandhe-ai-backend-cuda` dev-dependency
# コメント参照（イシュー #881・dev-dependencies は path-only strip 方針。
# `docs/crates-io-publishing-order.md`）。
fandhe-ai-backend-metal = { path = "../backend-metal" }
