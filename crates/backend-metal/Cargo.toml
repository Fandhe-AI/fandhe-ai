[package]
name = "backend-metal"
description = "Metal バックエンド（objc2 系。macOS 限定。REQ-2）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu/Cargo.toml` の #29 先例と
# 同種の判断）。TASK-1.9a（#44）でデバイス列挙・選択の共通 trait
# `tensor_core::device::DeviceProvider` を実装するために追加した。
tensor-core = { path = "../tensor-core" }
half.workspace = true

# Apple フレームワークへの FFI 境界（REQ-2）。objc2-metal は macOS 専用 API のバインディング
# のため他 OS ではビルド対象外にする（PoC-v2-5 実証構成。
# docs/spec/03-poc/poc-v2-5-backend-numeric-parity/code/rust/Cargo.toml:44-52）。
# TASK-2.1a（イシュー #49）でこの target cfg 分離を正式なバックエンド切替機構として確定した。
# 非 macOS（Linux）ターゲットでは `cargo tree -p backend-metal` に objc2 系が現れないことを
# 実測確認済み（`cargo build --workspace` も成立する）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

[dev-dependencies]
# 受け入れ条件「naive GEMM の数値が CPU 参照実装と複合判定で一致する」
# （REQ-2 統一複合判定。TASK-1.8b・#39）の判定基盤。workspace 内クレート
# 同士の path 依存であり、許容依存 8 区分（外部クレート）の新規追加には
# 当たらない（`crates/backend-cpu/Cargo.toml` が `bench-harness` を
# 同様に dev-dependencies へ path 依存させた #29 の先例と同種の判断）。
backend-cpu = { path = "../backend-cpu" }
# 決定的シード PRNG（`Xorshift64Star`）をパリティテストの入力生成に使う
# （coding-rust.md「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。上記と同じ判断根拠（path 依存・ユーザー承認不要）。
bench-harness = { path = "../bench-harness" }

# Cargo は `[[example]]` を既定で `test = false` として扱うため、
# `cargo test -p backend-metal`（rust-ci が実行する経路）は example 内の
# `#[cfg(test)]` を素通りしコンパイル検証のみで終わる。本 example は
# `analytics::mlx_case1_domain`（MLX split-K 選択条件との突合。イシュー
# #810）の回帰検知テストを持つため、`test = true` を明示して CI 実行対象へ
# 含める（`docs/backend-metal-splitk-decision.md`・
# `docs/perf/metal-gemm-splitk-shapes.md` の対象形状群の前提が壊れていない
# ことを機械的に保証する）。
[[example]]
name = "gemm_splitk_shapes_bench"
test = true
