[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/backend-metal`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_backend_metal`。
name = "fandhe-ai-backend-metal"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「Metal バックエンド（objc2 系。macOS 限定。REQ-2）」
description = "Metal backend (objc2, macOS only) for a from-scratch Rust AI/ML library"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の本クレートページに表示される readme（イシュー #882）。
# 「fandhe-ai 経由での利用が唯一のサポート面・本クレートへの直接依存は
# サポート対象外」を明示する per-crate 方式を採用（`crates/facade/Cargo.toml`
# の同コメント参照）。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords / categories の
# 制約・出典は `crates/facade/Cargo.toml` の同コメント参照。
keywords = ["metal", "gpu", "apple-silicon", "machine-learning"]
categories = ["science", "mathematics", "hardware-support"]

[dependencies]
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu/Cargo.toml` の #29 先例と
# 同種の判断）。TASK-1.9a（#44）でデバイス列挙・選択の共通 trait
# `tensor_core::device::DeviceProvider` を実装するために追加した。
# `version` 併記の理由は `crates/autodiff/Cargo.toml` の同依存コメントを参照
# （公開 6 クレート間 path 依存。イシュー #881 で確定した方針。
# `docs/crates-io-publishing-order.md`）。
fandhe-ai-tensor-core = { path = "../tensor-core", version = "=0.7.0" }
half.workspace = true

# Apple フレームワークへの FFI 境界（REQ-2）。objc2-metal は macOS 専用 API のバインディング
# のため他 OS ではビルド対象外にする（PoC-v2-5 実証構成。
# docs/spec/03-poc/poc-v2-5-backend-numeric-parity/code/rust/Cargo.toml:44-52）。
# TASK-2.1a（イシュー #49）でこの target cfg 分離を正式なバックエンド切替機構として確定した。
# 非 macOS（Linux）ターゲットでは `cargo tree -p fandhe-ai-backend-metal` に objc2 系が現れないことを
# 実測確認済み（`cargo build --workspace` も成立する）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

[dev-dependencies]
# 受け入れ条件「naive GEMM の数値が CPU 参照実装と複合判定で一致する」
# （REQ-2 統一複合判定。TASK-1.8b・#39）の判定基盤。workspace 内クレート
# 同士の path 依存であり、許容依存 8 区分（外部クレート）の新規追加には
# 当たらない（`crates/backend-cpu/Cargo.toml` が `bench-harness` を
# 同様に dev-dependencies へ path 依存させた #29 の先例と同種の判断）。
# `version` を付けない理由（イシュー #881 で確定した dev-dependencies 方針。
# `docs/crates-io-publishing-order.md`）: `cargo publish` は
# dev-dependencies から path のみの依存を自動 strip するため、公開物には
# 一切残らない。加えて本依存は macOS 限定で `backend-cpu ⇄ backend-metal`
# の循環（backend-cpu 側の macOS 限定 dev-dep で本クレートへ依存。
# `crates/backend-cpu/Cargo.toml` の `[target.'cfg(target_os = "macos")'.
# dev-dependencies]` 参照）を成すため、version 併記のままだと初回 publish
# 時に「registry 未存在バージョンへの依存」でブロックされうる。strip 方式
# に統一することで公開順序の制約を `[dependencies]` のトポロジカル順のみ
# に単純化できる。
fandhe-ai-backend-cpu = { path = "../backend-cpu" }
# 決定的シード PRNG（`Xorshift64Star`）をパリティテストの入力生成に使う
# （coding-rust.md「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。上記と同じ判断根拠（path 依存・ユーザー承認不要）。
bench-harness = { path = "../bench-harness" }

# Cargo は `[[example]]` を既定で `test = false` として扱うため、
# `cargo test -p fandhe-ai-backend-metal`（rust-ci が実行する経路）は example 内の
# `#[cfg(test)]` を素通りしコンパイル検証のみで終わる。本 example は
# `analytics::mlx_case1_domain`（MLX split-K 選択条件との突合。イシュー
# #810）の回帰検知テストを持つため、`test = true` を明示して CI 実行対象へ
# 含める（`docs/backend-metal-splitk-decision.md`・
# `docs/perf/metal-gemm-splitk-shapes.md` の対象形状群の前提が壊れていない
# ことを機械的に保証する）。
[[example]]
name = "gemm_splitk_shapes_bench"
test = true

# 同上の理由（`cargo test` は既定で example 内の `#[cfg(test)]` を検査
# 対象にしない）。本 example は `single_run_verdict_tests`（AC-3
# クロスプラットフォーム純関数の回帰検知テスト。イシュー #1278・PR #1372
# codex-review／Bugbot 指摘）を持つため `test = true` を明示する。
[[example]]
name = "gemm_fine_barrier_ab_bench"
test = true

# 同上の理由。本 example は `single_run_verdict_tests`（フェーズ 2・3
# 双方の比列を受け取る 4 値 verdict 純関数のクロスプラットフォーム回帰
# 検知テスト。イシュー #1279）を持つため `test = true` を明示する
# （`gemm_fine_barrier_ab_bench` と同型）。
[[example]]
name = "gemm_swizzle_ab_bench"
test = true
