[package]
name = "backend-metal"
description = "Metal バックエンド（objc2 系。macOS 限定。REQ-2）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
half.workspace = true

# Apple フレームワークへの FFI 境界（REQ-2）。objc2-metal は macOS 専用 API のバインディング
# のため他 OS ではビルド対象外にする（PoC-v2-5 実証構成。
# docs/spec/03-poc/poc-v2-5-backend-numeric-parity/code/rust/Cargo.toml:44-52）。
# TASK-2.1a（イシュー #49）でこの target cfg 分離を正式なバックエンド切替機構として確定した。
# 非 macOS（Linux）ターゲットでは `cargo tree -p backend-metal` に objc2 系が現れないことを
# 実測確認済み（`cargo build --workspace` も成立する）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

[dev-dependencies]
# 受け入れ条件「naive GEMM の数値が CPU 参照実装と複合判定で一致する」
# （REQ-2 統一複合判定。TASK-1.8b・#39）の判定基盤。workspace 内クレート
# 同士の path 依存であり、許容依存 8 区分（外部クレート）の新規追加には
# 当たらない（`crates/backend-cpu/Cargo.toml` が `bench-harness` を
# 同様に dev-dependencies へ path 依存させた #29 の先例と同種の判断）。
backend-cpu = { path = "../backend-cpu" }
# 決定的シード PRNG（`Xorshift64Star`）をパリティテストの入力生成に使う
# （coding-rust.md「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。上記と同じ判断根拠（path 依存・ユーザー承認不要）。
bench-harness = { path = "../bench-harness" }
