[package]
name = "bench-harness"
description = "計測基盤（REQ-8）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# CUDA `stream.synchronize()` による同期方式統一（sync.rs・TASK-8.1b）に使用する。
# 無条件依存＋動的ロード方式のため、CUDA toolkit 非搭載環境でも本クレートの
# ビルドが成立する（.claude/rules/deps-policy.md）。
cudarc.workspace = true
# rng.rs の `fill_vec_f16` が返す f16 ベクトルの型として使用する。
half.workspace = true

# Metal コマンドバッファの完了待ち（sync.rs・TASK-8.1b）に使用する。
# `cfg(target_os = "macos")` 限定（.claude/rules/deps-policy.md）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

# criterion は dev-dependencies 限定（deps-policy.md）。5 回計測の中央値を採用する
# ベンチ規約（.claude/rules/coding-rust.md）の実行基盤として使用する。
[dev-dependencies]
criterion.workspace = true
