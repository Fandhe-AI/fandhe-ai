[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/facade` は
# 変更しない。lib 名は Rust 識別子化された `fandhe_ai`（`use fandhe_ai::` で
# 参照する。facade が唯一のサポートされる公開 API 面。CLAUDE.md）。
name = "fandhe-ai"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「composition root・compat 公開面（REQ-1・REQ-9・TASK-9.3）」
description = "Facade crate for a from-scratch Rust AI/ML library: tensors, autodiff, and CPU/CUDA/Metal backends behind one composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の各クレートページに表示される readme（イシュー #882）。
# ルート README 共用ではなく per-crate 方式を採用: ルート README は開発環境
# 構築・CI 等の内部開発情報まで含むため、crates.io ページにそのまま出すと
# 「fandhe-ai が唯一のサポートされる公開 API 面」という境界
# （docs/compat-api-scope.md §0）が伝わらない。本クレートには利用者向け
# クイックスタートのみを書く。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords は crates.io
# 制約（最大 5 個・各 20 文字以内英数字とハイフン）を満たす。categories は
# crates.io の有効スラッグ（https://crates.io/api/v1/categories で実測確認済み）
# のみを使う。
keywords = ["ai", "machine-learning", "deep-learning", "tensor", "autograd"]
categories = ["science", "mathematics"]

# 依存形状は `crates/bench-harness/Cargo.toml` と同型（spec 確定。
# docs/spec/05-tasks.md TASK-9.3）: `backend-cuda` は無条件依存（`cudarc`
# 動的ロード方式により CUDA toolkit 非搭載環境でもビルド成立）、
# `backend-metal` は `cfg(target_os = "macos")` 限定で分離する。外部
# クレートの新規追加はなく workspace member 間の path 依存のみのため、
# ユーザー承認不要と判断する（イシュー #410 実装計画 §2-3。
# `docs/license-matrix.md` の更新も不要）。
[dependencies]
# `version` 併記の理由は `crates/autodiff/Cargo.toml` の同依存コメントを参照
# （公開 6 クレート間 path 依存。イシュー #881 で確定した方針。
# `docs/crates-io-publishing-order.md`。workspace 公開バージョンと完全
# 一致させる）。以下 facade の全 path 依存も同じ。
#
# `Device`／`BackendError`（公開 API の引数・戻り値型として再エクスポート）・
# `DeviceProvider`／`select_from`（CUDA/Metal 選択時の存在検証）に使用する。
fandhe-ai-tensor-core = { path = "../tensor-core", version = "=0.6.0" }
# `Tape::new_with_ops`（facade 向け内部 API。crates/autodiff/src/tape.rs）を
# composition root の唯一の呼び出し元として使う。
fandhe-ai-autodiff = { path = "../autodiff", version = "=0.6.0" }
# 既定バックエンド（TASK-2.5 ユーザー承認済み）である `CpuBackendOps` を
# `facade::tape()` から構築する。
fandhe-ai-backend-cpu = { path = "../backend-cpu", version = "=0.6.0" }
# `Device::Cuda(_)` 指定時に `CudaBackendOps`／`CudaDeviceProvider` を解決する。
fandhe-ai-backend-cuda = { path = "../backend-cuda", version = "=0.6.0" }

# `Device::Metal` 指定時に `MetalBackendOps`／`MetalDeviceProvider` を解決する。
# `cfg(target_os = "macos")` 限定（.claude/rules/deps-policy.md）。
[target.'cfg(target_os = "macos")'.dependencies]
fandhe-ai-backend-metal = { path = "../backend-metal", version = "=0.6.0" }

# TASK-9.4（#411）: compat 層の移設に伴い追加。学習系統合テスト
# （`tests/compat_sequential_train.rs`）が決定的シード駆動のデータ生成に
# `bench_harness::rng::Xorshift64Star` を使う（`.claude/rules/
# coding-rust.md`「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。外部クレートの新規追加ではなく workspace member 間の path
# 依存のため、`Cargo.toml` 冒頭コメントの判断（ユーザー承認不要・
# `docs/license-matrix.md` 更新不要）と同じ扱いとする。
[dev-dependencies]
bench-harness = { path = "../bench-harness" }
