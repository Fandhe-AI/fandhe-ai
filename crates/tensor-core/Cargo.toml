[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/tensor-core`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_tensor_core`。
name = "fandhe-ai-tensor-core"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「テンソル型・演算グラフ／カーネル融合機構の完全自作コア（REQ-1）」
description = "From-scratch tensor type, computation graph, and kernel fusion core for a Rust AI/ML library"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の本クレートページに表示される readme（イシュー #882）。
# 「fandhe-ai 経由での利用が唯一のサポート面・本クレートへの直接依存は
# サポート対象外」を明示する per-crate 方式を採用（`crates/facade/Cargo.toml`
# の同コメント参照）。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords / categories の
# 制約・出典は `crates/facade/Cargo.toml` の同コメント参照。
keywords = ["tensor", "machine-learning", "linear-algebra", "gemm"]
categories = ["science", "mathematics"]

[dependencies]
# f16 数値型（REQ-1）。バージョンは workspace ルート Cargo.toml の
# [workspace.dependencies]（.claude/rules/deps-policy.md 準拠）で一元固定する。
half.workspace = true
