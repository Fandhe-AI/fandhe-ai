[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/tensor-core`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_tensor_core`。
name = "fandhe-ai-tensor-core"
description = "テンソル型・演算グラフ／カーネル融合機構の完全自作コア（REQ-1）"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true

[dependencies]
# f16 数値型（REQ-1）。バージョンは workspace ルート Cargo.toml の
# [workspace.dependencies]（.claude/rules/deps-policy.md 準拠）で一元固定する。
half.workspace = true
