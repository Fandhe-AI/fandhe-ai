[package]
name = "self-repair"
description = "自己修復ループ（REQ-3）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# CLI バイナリ（TASK-3.4 残作業・イシュー #145）。lib（`src/lib.rs`）は維持する。
# `docs/guardrail-self-repair-cli.md` 3.2 節「self-repair verify-log」の実装。
# `3.1 self-repair run` は未実装（別イシューのスコープ。`lib.rs` モジュール
# コメント「CLI バイナリ（self-repair run/verify-log）→ 後続タスク」参照）
# のため、本 bin は verify-log サブコマンドのみを持つ最小骨格とする。将来
# `run` を追加する際は `cli::Command` へ variant を拡張する形で結線する
# （guardrail の `check`/`eval` 二本立てと同じ拡張パターン）。
[[bin]]
name = "self-repair"
path = "src/main.rs"

[dependencies]
# 試行ログ・起動インターフェース入出力の構造化データシリアライズ（REQ-3）。
serde.workspace = true
serde_json.workspace = true
# 3 分岐判定（`guardrail::decision`）を lib として直接呼び出す設計
# （`docs/guardrail-self-repair-cli.md` 3.4 節）に加え、決定的シード設定
# ユーティリティ（`guardrail::determinism`・TASK-4.4b）を再輸出するための
# workspace 内部 path 依存。
guardrail = { path = "../guardrail" }
