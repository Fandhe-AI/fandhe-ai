[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/backend-cuda`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_backend_cuda`。
name = "fandhe-ai-backend-cuda"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「CUDA バックエンド（cudarc 動的ロード。REQ-2）」
description = "CUDA backend (dynamic-loading via cudarc) for a from-scratch Rust AI/ML library"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の本クレートページに表示される readme（イシュー #882）。
# 「fandhe-ai 経由での利用が唯一のサポート面・本クレートへの直接依存は
# サポート対象外」を明示する per-crate 方式を採用（`crates/facade/Cargo.toml`
# の同コメント参照）。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords / categories の
# 制約・出典は `crates/facade/Cargo.toml` の同コメント参照。
keywords = ["cuda", "gpu", "gemm", "machine-learning"]
categories = ["science", "mathematics", "hardware-support"]

[[example]]
# `cargo test --workspace`（Makefile の `test` ターゲット・CI の rust-ci
# test ジョブが使うコマンド）は既定では example ターゲットの `test = false`
# のため、`#[cfg(test)] mod tests` を持つ example はテストハーネスがビルド
# されるだけで実行されない（`cargo test -p fandhe-ai-backend-cuda --example
# device_attributes_dump` の明示指定時のみ実行される）。本 example が追加
# した `bw_grid_dim`・`bandwidth_gbps`・`bytes_per_cycle` の単体テストを
# CI で確実に実行するため `test = true` を明示する（イシュー #482 Review
# 指摘）。
name = "device_attributes_dump"
test = true

[[example]]
# PR #692 Bugbot 指摘（Medium, test-coverage）対応: `cuda_floor_bench` は
# `#[cfg(test)] mod tests` に `reference_only_sizes_are_disjoint_from_judged_sizes`
# （REFERENCE_ONLY_SIZES と JUDGED_SIZES の非重複を検査する不変条件テスト。
# #502 由来）を持つが、example ターゲットは既定で `test = false`
# のため `cargo test --workspace` では実行されずこの不変条件検査が
# 強制されていなかった。`device_attributes_dump`（上記）と同じ理由・同じ
# 是正方法で `test = true` を明示する。
name = "cuda_floor_bench"
test = true

[dependencies]
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu/Cargo.toml` の #29 先例と
# 同種の判断）。TASK-1.9a（#44）でデバイス列挙・選択の共通 trait
# `tensor_core::device::DeviceProvider` を実装するために追加した。
# `version` 併記の理由は `crates/autodiff/Cargo.toml` の同依存コメントを参照
# （公開 6 クレート間 path 依存。イシュー #881 で確定した方針。
# `docs/crates-io-publishing-order.md`）。
fandhe-ai-tensor-core = { path = "../tensor-core", version = "=0.3.0" }
# CUDA バックエンド（REQ-2）。無条件依存＋動的ロード方式のため cfg 分離しない
# （features・default-features は workspace ルートの [workspace.dependencies] で確定済み。
# member 側で default-features を再指定しても inherited dependency には反映されないため
# ここでは workspace = true のみを指定する）。
# TASK-2.1a（イシュー #49）でこの無条件依存＋動的ロード構成を正式なバックエンド切替機構と
# して確定した。CUDA toolkit 非搭載環境でも `cargo build --workspace` が成立することを
# 確認済み（実行時のみ toolkit を要求する契約は変更しない）。
cudarc.workspace = true
half.workspace = true

[features]
# `backend_cuda::diagnostics`（内部カーネルのタイル定数を返す診断専用関数群）を
# 通常の公開 API 面から外すための feature ゲート（PR #637 codex-review P1 指摘の
# 是正）。この feature を有効化しない既定ビルドでは `diagnostics` モジュール自体が
# コンパイルされないため、crate 外部から到達不能（`pub mod` として存在しない）。
# `examples/gemm_profile_target.rs`（occupancy 概算専用。イシュー #486）のみが
# `required-features` 経由で本 feature を要求する。deps-policy.md「バックエンド
# 切替は feature フラグなしの cfg ベース」はバックエンド選択（CUDA/Metal/CPU）に
# 関する規約であり、本 feature は内部診断専用ツールの可視性制御であって対象外。
internal-diagnostics = []

[[example]]
name = "gemm_profile_target"
required-features = ["internal-diagnostics"]

[[test]]
# `SpecializedMmaKernelHandle`／`run_specialized_mma_f16`（テスト・ベンチ
# 専用の検証用ハンドル。`src/lib.rs`・`src/gemm_auto.rs` の同 feature
# ゲート済み re-export 参照）を使う外部 integration test。PR #685
# codex-review P1 指摘の是正: 上記シンボルを既定ビルドの公開 API 面から
# 除外したため、これらを使う本テストも `internal-diagnostics` feature
# なしではビルドできない。`required-features` により `cargo test
# --workspace`（feature 未指定）では対象外としてスキップされ、
# `cargo test --all-features`（CI の test ジョブ・`make test` が使う
# コマンド。`scripts/run-verification-gates.sh` 冒頭コメント参照）で
# のみビルド・実行される。
name = "specialized_mma_parity"
required-features = ["internal-diagnostics"]

[[example]]
# イシュー #499: 動的グルーピング幅選択（`backend_cuda::diagnostics::
# mma_swizzle_group_width`）を使うため `gemm_profile_target` と同じ
# feature ゲートを要求する（`examples/gemm_mma_swizzle_bench.rs` 冒頭
# コメント参照）。
name = "gemm_mma_swizzle_bench"
required-features = ["internal-diagnostics"]

[[example]]
# イシュー #742: TF32 opt-staged 段数スイープ計測は動的共有メモリ変種
# （`backend_cuda::diagnostics::render_wmma_tf32_staged_dyn`・
# `CompiledWmmaTf32StagedDynKernel`・`wmma_tf32_staged_dyn_smem_bytes`）を
# 使うため、`gemm_profile_target`・`gemm_mma_swizzle_bench` と同じ feature
# ゲートを要求する（`examples/gemm_wmma_tf32_staged_stages_bench.rs` 冒頭
# コメント参照）。
name = "gemm_wmma_tf32_staged_stages_bench"
required-features = ["internal-diagnostics"]

[[example]]
# イシュー #741: TF32 opt-staged 経路への swizzle 横展開の A/B ベンチ
# （`gemm_mma_swizzle_bench` と同型）。`gemm.rs::
# CudaGemm::new_with_tf32_staged_swizzle`（同 feature ゲート）を使う。
name = "gemm_wmma_tf32_swizzle_bench"
required-features = ["internal-diagnostics"]

[[example]]
# イシュー #840: #804 が整備した f16 `mma.sync` ブロックタイル・ステージ数
# 拡大候補（`diagnostics::mma_f16_source_with_block_tile`）を実際に NVRTC
# コンパイル・起動して現行本番定数と実機 A/B 計測する（`gemm_wmma_tf32_
# staged_stages_bench` と同型）。`diagnostics::render_mma_f16_block_tile`/
# `CompiledMmaF16BlockTileKernel`（同 feature ゲート）を使う。
name = "gemm_mma_block_tile_bench"
required-features = ["internal-diagnostics"]

[[example]]
# イシュー #841: #806（PR #832）が整備した TF32 生 `mma.sync` ブロック
# タイル・ステージ数拡大候補（`diagnostics::mma_tf32_source_with_block_
# tile`）を実際に NVRTC コンパイル・起動して現行本番定数と実機 A/B 計測
# する（`gemm_mma_block_tile_bench`〈#840・f16 版〉と同型）。
# `diagnostics::render_mma_tf32_block_tile`/`CompiledMmaTf32BlockTileKernel`
# （同 feature ゲート）を使う。
name = "gemm_mma_tf32_block_tile_bench"
required-features = ["internal-diagnostics"]

[dev-dependencies]
# CPU 参照実装（`gemm_naive`。`mul_add` FMA 契約）を GEMM 数値一致テスト
# （tests/gemm_naive.rs・#33）の比較対象として使う。workspace 内クレート
# 同士の path 依存であり、許容依存 8 区分（外部クレート）の新規追加には
# 当たらない（`crates/backend-cpu/Cargo.toml:20-25` の bench-harness 依存と
# 同じ整理）。
# `version` を付けない理由（イシュー #881 で確定した dev-dependencies 方針。
# `docs/crates-io-publishing-order.md`）: `cargo publish` は
# dev-dependencies から path のみの依存を自動 strip するため、公開物には
# 一切残らない。加えて本依存は `backend-cpu ⇄ backend-cuda` の循環
# （backend-cpu 側の dev-dep で本クレートへ依存。
# `crates/backend-cpu/Cargo.toml` 参照）を成すため、version 併記のままだと
# 初回 publish 時に「registry 未存在バージョンへの依存」でブロックされ
# うる。strip 方式に統一することで公開順序の制約を `[dependencies]` の
# トポロジカル順のみに単純化できる。
fandhe-ai-backend-cpu = { path = "../backend-cpu" }
# 決定的シード PRNG（`Xorshift64Star`）を GEMM 入力生成に使う
# （coding-rust.md「学習系回帰テストには決定的シード設定ユーティリティを
# 使う」）。上記と同じ理由で許容依存 8 区分の対象外。
bench-harness = { path = "../bench-harness" }
