# 空の [workspace] テーブル: このフィクスチャ crate をルート workspace
# （crates/* glob 相当の member 列挙）の巻き込みから切り離すための宣言
# （TASK-4.2a・イシュー #109。v1 リポ〈イシュー #269・PR #276〉の同一方針を
# 踏襲）。本 crate は「ガードレール判定器の評価用に意図的に欠陥・ゲーミングを
# 注入するテストデータの適用対象」であり、workspace に参加させると
# cargo build/clippy/test/fmt の対象へ紛れ込み、CI が本 crate の欠陥注入後の
# 状態を誤って本物のビルド失敗として扱ってしまう。詳細は同ディレクトリの
# README.md（データセットの由来・隔離方針）を参照。
[workspace]

[package]
name = "guardrail_labeled_changes_baseline"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "guardrail_labeled_changes_baseline"
path = "src/lib.rs"

[[bin]]
name = "guardrail_labeled_changes_baseline"
path = "src/main.rs"

[dependencies]
# 自作コア（Burn 非依存。REQ-1 v2・.claude/rules/coding-rust.md）の
# テンソル・autodiff を workspace 内 path 依存として直接参照する。
# `[workspace]` テーブルで本 crate はルート workspace の member ではないが、
# path 依存自体は member 外からでも解決できる（Cargo の通常の path 依存機構）。
tensor-core = { path = "../../../../../tensor-core" }
autodiff = { path = "../../../../../autodiff" }

[dev-dependencies]
# 決定的シード生成（`Xorshift64Star`）に使う。autodiff 側の学習収束テスト
# （`autodiff/tests/nn_train_convergence.rs`）と同一の利用パターン。
bench-harness = { path = "../../../../../bench-harness" }
# ベンチ計測基盤（許容依存 8 区分。dev-dependencies 限定。deps-policy.md）。
# ルート workspace の [workspace.dependencies] と同一バージョンに固定する
# （本 crate は workspace 非参加のため `.workspace = true` 継承が使えず、
# バージョン文字列を直書きする）。
criterion = "=0.8.2"

[[bench]]
name = "forward_bench"
harness = false
