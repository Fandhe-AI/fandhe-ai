[package]
name = "guardrail"
description = "自己修復ループのガードレール（REQ-4）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 判定レポート・設定ファイル（guardrail.toml 等）の構造化データシリアライズ（REQ-4）。
serde.workspace = true
serde_json.workspace = true
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu/Cargo.toml` の同種判断を踏襲）。
# ベンチゲート計測系の実行系として bench-harness の計測 API（`run`・`MeasurementConfig`・
# `median_q1_q3`）を呼び出す（依存方向は `guardrail` → `bench-harness`。
# `docs/guardrail-self-repair-cli.md` 1.4 節。TASK-4.1d・#107）。
bench-harness = { path = "../bench-harness" }
