[package]
name = "guardrail"
description = "自己修復ループのガードレール（REQ-4）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# CLI バイナリ（TASK-4.1a）。lib（`src/lib.rs`）は維持する。`self-repair` は
# サブプロセス起動ではなく lib として直接呼び出す設計のため（3.4 節。
# `docs/guardrail-self-repair-cli.md`）、bin は lib の薄い統合層に留める。
[[bin]]
name = "guardrail"
path = "src/main.rs"

[dependencies]
# 判定レポート・設定ファイル（guardrail.toml 等）の構造化データシリアライズ（REQ-4）。
serde.workspace = true
serde_json.workspace = true
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない。`backend-cpu/Cargo.toml` の同種判断を踏襲）。
# 用途は 2 つ: (1) ベンチゲート計測系の実行系として bench-harness の計測 API
# （`run`・`MeasurementConfig`・`median_q1_q3`）を呼び出す（TASK-4.1d・#107）。
# (2) 決定的シードユーティリティ（determinism.rs・TASK-4.4b）が `Xorshift64Star`
# を再利用し、PRNG 本体を再実装しない（TASK-4.4b）。依存方向は
# `docs/guardrail-self-repair-cli.md` 1.4 節の既定（guardrail → bench-harness）に従う。
bench-harness = { path = "../bench-harness" }
