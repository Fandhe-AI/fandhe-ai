[package]
name = "guardrail"
description = "自己修復ループのガードレール（REQ-4）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# CLI バイナリ（TASK-4.1a）。lib（`src/lib.rs`）は維持する。`self-repair` は
# サブプロセス起動ではなく lib として直接呼び出す設計のため（3.4 節。
# `docs/guardrail-self-repair-cli.md`）、bin は lib の薄い統合層に留める。
[[bin]]
name = "guardrail"
path = "src/main.rs"

[dependencies]
# 判定レポート・設定ファイル（guardrail.toml 等）の構造化データシリアライズ（REQ-4）。
serde.workspace = true
serde_json.workspace = true
# workspace 内部クレート（path 依存）。deps-policy.md の許容依存 8 区分の対象外であり
# ユーザー承認不要（外部依存の新規追加ではない）。TASK-4.4a（イシュー #112）が
# `median_gate` モジュール（5 回以上計測の中央値算出）の唯一の中央値定義として
# `bench_harness::median_q1_q3` を呼び出すために使用する（依存方向は
# `guardrail` → `bench-harness`。`docs/guardrail-self-repair-cli.md` 1.4 節）。
bench-harness = { path = "../bench-harness" }
