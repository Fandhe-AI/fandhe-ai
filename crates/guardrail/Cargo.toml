[package]
name = "guardrail"
description = "自己修復ループのガードレール（REQ-4）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# CLI バイナリ（TASK-4.1a）。lib（`src/lib.rs`）は維持する。`self-repair` は
# サブプロセス起動ではなく lib として直接呼び出す設計のため（3.4 節。
# `docs/guardrail-self-repair-cli.md`）、bin は lib の薄い統合層に留める。
[[bin]]
name = "guardrail"
path = "src/main.rs"

[dependencies]
# 判定レポート・設定ファイル（guardrail.toml 等）の構造化データシリアライズ（REQ-4）。
serde.workspace = true
serde_json.workspace = true
# 決定的シードユーティリティ（determinism.rs・TASK-4.4b）が `Xorshift64Star` を
# 再利用するための workspace 内部 path 依存。PRNG 本体を再実装せず、依存方向は
# `docs/guardrail-self-repair-cli.md` 1.4 節の既定（guardrail → bench-harness）
# に従う。許容依存 8 区分（外部クレート）の追加には当たらない
# （backend-cpu → bench-harness 等の既存先例あり。`.claude/rules/deps-policy.md`）。
bench-harness = { path = "../bench-harness" }
