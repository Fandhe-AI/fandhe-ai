# cargo-deny 設定。CI の deny ジョブ（.github/workflows/ci.yml の rust-ci ジョブ →
# Fandhe-AI/actions rust-base-ci の deny ジョブ）・`make deny`（Makefile）が本ファイルの
# 存在で自動有効化され、`cargo deny --locked check advisories bans licenses sources` として
# 常時実行される（advisories / bans は #353 で追加。licenses の実測根拠は
# docs/license-matrix.md〈実測日 2026-08-06・Cargo.lock SHA
# 63748a677a0800257c8175b8fb8bbf187669cbe1〉）。

[advisories]
# RUSTSEC アドバイザリ監査（vulnerability / unmaintained / unsound / yanked。#353）。
# 従来 advisories は CI のチェック対象外だったが、ローカル実測
# （`cargo deny --locked check advisories`）で違反 0 件を確認したうえで有効化した。
# アドバイザリ DB の取得（$CARGO_HOME/advisory-dbs/ への clone・以降は fetch 更新のみ）は
# cargo-deny の check 実行に内包される。
version = 2
# ignore へアドバイザリ ID を追加する場合は、理由・解消予定（追跡 Issue 番号）を
# コメント付きで記録し、レビューを必須とする。現時点で ignore が必要な
# アドバイザリは存在しない。

[licenses]
version = 2
include-dev = true
# [graph].targets を指定しない（既定で Cargo.lock 全域が対象。docs/license-matrix.md
# 5 節「Cargo.lock 全域」と一致させる）。ターゲット限定すると UEFI/wasm 等の
# target-gated 依存（r-efi・wasip2 等）が判定対象から外れ、fail-closed の
# コピーレフト監視（deps-policy.md）に穴が生じるため、意図的に全域を対象とする。
# include-dev = true: `criterion`（bench-harness の dev-dependencies 限定。
# deps-policy.md）とその推移的依存サブツリーは既定（false）だとライセンス
# 監査から除外されてしまい、docs/license-matrix.md 5 節が明記する
# 「Cargo.lock 全域」（normal/build/dev 全エッジ）の実測スコープと矛盾する
# （Bugbot 指摘・PR #211）。dev-dependencies 側もここで fail-closed 監査する。
#
# allow は docs/license-matrix.md 5 節「外部 104 パッケージのライセンス分布」
# （Cargo.lock 全域の cargo metadata --locked 実測）に出現した式を構成する
# 個別ライセンス識別子（SPDX）を列挙する。OR 結合の式は列挙したいずれか 1 つを
# 満たせば許可される（cargo-deny の仕様）。r-efi（`… OR LGPL-2.1-or-later`）・
# wasip2（`Apache-2.0 WITH LLVM-exception OR …`）はいずれも MIT の選択で満たされる
# （docs/license-matrix.md 6 節の個別判断）。コピーレフト単独ライセンス
# （GPL/LGPL/MPL 等）は列挙しないため、将来の推移的依存混入は fail-closed で検出される。
#
# 本 allow リストは直接依存 8 区分の適合基準（MIT OR Apache-2.0 系）を緩和するものではない。
# あくまで推移的依存の実測結果を運用化したものであり、allow リストの変更は
# license-matrix.md の更新とセットでユーザー承認を経る（REQ-5・deps-policy.md）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
]
confidence-threshold = 0.8

[sources]
# 全依存が crates.io 由来であることを実測済み（docs/license-matrix.md 5 節）。
# git 依存・代替レジストリの混入をサプライチェーン観点で fail-closed 検出する。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 重複バージョン・ワイルドカード依存の監査（#353。CI 常時実行は ci.yml の rust-ci
# ジョブの `deny-checks` 入力に `bans` を明示指定することで有効化）。
# 依存禁止リスト（.claude/rules/deps-policy.md）は Makefile の deps-forbidden
# ターゲットで別途 Cargo.lock を機械検査するため、本ファイルでは重複させない
# （`deny = [...]` の明示リストは現時点で持たない。追加する場合は
# `deny = [{ crate = "<name>", reason = "..." }]` 形式で理由を記録し、レビューを必須とする）。

# 同一クレートの複数バージョン混入の検出。許容依存 8 区分を `=x.y.z` 完全固定する
# 本リポジトリの deps-policy.md 方針では重複は原則発生しない前提だが、推移的依存
# 経由の重複は依存元側の追随を待つほかなく "deny" ではノイズが上回るため、
# local-llm-server（PR #571）と同じく警告に留めて CI ログで増加傾向を観測する
# （#353 実測時点の重複は 0 件）。
multiple-versions = "warn"

# バージョン要求 `*` の依存宣言を拒否する（バージョン無指定はサプライチェーン上
# 任意の最新版を受け入れる宣言であり、許容依存 8 区分の `=x.y.z` 完全固定方針
# （deps-policy.md）に反するため fail-closed で弾く）。
wildcards = "deny"
# ワークスペース内 9 クレートは全て `publish = false`（workspace 継承）の private
# クレートで、相互参照はバージョン無しの path 依存（cargo 上は `*` 扱い）のため、
# private クレートの path 依存に限り wildcards の対象外とする（cargo-deny の仕様上
# publish 対象クレートの path 依存には適用されず、その場合は従来どおり deny される）。
allow-wildcard-paths = true
