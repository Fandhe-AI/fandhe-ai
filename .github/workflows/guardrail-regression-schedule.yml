# guardrail 判定器の 2 層検証（REQ-4 判定器単体・REQ-5 除外適用後）を、push/PR が
# 無い期間も定期的に実行し結果を継続確認する（TASK-6.1b・docs/spec/05-tasks.md、
# イシュー #148）。
#
# TASK-6.1a（#147）で整備した .github/workflows/ci.yml の guardrail-regression ジョブと
# 検証ロジックを共用する（scripts/run-guardrail-regression.sh が単一ソース。self-test →
# layer1 → layer2 の順で呼ぶ点も同一）。責務分担は「ci.yml 側は push/PR 契機の PR
# チェック」「本ワークフローは schedule 契機の定期実行」であり、検証ロジック自体を
# 二重に持たない。
#
# schedule トリガーは default branch（main）上に登録されたワークフロー定義でのみ発火する
# （GitHub Actions の仕様）。マージ前は workflow_dispatch による構文検証のみが可能で、
# 実際の schedule 発火・実行結果はマージ後に確認する。
#
# report ジョブ（scripts/report-guardrail-schedule-result.sh）は、schedule 実行が
# push/PR チェックと異なり人の目に触れないため、失敗を追跡用 Issue に可視化する
# （.claude/rules/security.md A09。ガードレール 3 分岐判定そのものには関与しない
# 「純粋な可視化」。同 A08 参照）。
name: Guardrail Regression (schedule)

on:
  schedule:
    # 20:30 UTC = 05:30 JST 毎日。0 分ちょうどの混雑帯を避ける（update-external.yml の
    # 00:00 UTC 実行とも重ならない）。
    - cron: '30 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: guardrail-regression-schedule
  # 実行中の検証を途中破棄すると 2 層検証の結果が欠落し「結果継続確認」の趣旨に反するため、
  # 直列化のみ行い cancel はしない。
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # 2 層検証本体（ci.yml の guardrail-regression ジョブと同一ステップ構成）
  # --------------------------------------------------
  guardrail-regression-scheduled:
    name: guardrail 2 層検証（定期実行）
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #468）。ci.yml の
    # guardrail-regression ジョブ（#466/#467 で移行済み）と同一パターンを踏襲する
    # （使い捨て VM のため actions/cache による依存の再利用を下記ステップで行う）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（ci.yml と同一 SHA に固定）。
        # persist-credentials: false: 本ジョブは checkout 後に GITHUB_TOKEN を使わない
        # （report ジョブのみ issues:write を使う。.claude/rules/ci.md）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行を、実行環境の cargo 有無に関わらず常時検出する
      # （ci.yml の guardrail-regression ジョブと同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/run-guardrail-regression.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため guardrail 2 層検証をスキップしました"
          fi

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（ci.yml の guardrail-regression ジョブと同一方針）。
      # 旧「Ensure rustup is installed」「Sync toolchain」の 2 手動ステップを置換する。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo registry（ci.yml の build 系ジョブと共通のキー構成。#466 で確立したキャッシュ
      # 設計を踏襲する）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # toolchain 実解決版数の取得（イシュー #917）。ci.yml の guardrail-regression
      # ジョブと同一キーを共有するため、キー構成（版数取得ステップ・キー形式）を
      # 完全同期する必要がある（同期を怠ると片方だけ版数を含むキーになり restore が
      # 常にミスするか、意図せず異なる target を共有する事故につながる）。取得ロジック・
      # fail-closed の理由は ci.yml 側の build ジョブのコメント参照。
      - name: toolchain 実解決版数の取得（target キャッシュキー用）
        id: toolchain-versions
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustc_ver="$(rustc --version | awk '{print $2}')"
          clippy_ver="$(cargo clippy --version | awk '{print $2}')"
          for v in "${rustc_ver}" "${clippy_ver}"; do
            printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.]+)?$' \
              || { echo "::error::toolchain 版数の取得に失敗: rustc=${rustc_ver} clippy=${clippy_ver}" >&2; exit 1; }
          done
          echo "rustc=${rustc_ver}" >> "${GITHUB_OUTPUT}"
          echo "clippy=${clippy_ver}" >> "${GITHUB_OUTPUT}"

      # target: ci.yml の guardrail-regression ジョブ（main への push 契機で先に走る）が
      # 保存するキャッシュと同一キーを使う。ビルド内容が同一（guardrail クレートの debug
      # テスト成果物のみ）であり、schedule 実行は main の最新 target キャッシュを restore
      # できる。完全一致ヒット時は actions/cache が再保存しないためキャッシュ容量も
      # 浪費しない（イシュー #468 の判断）。restore-keys は toolchain 実解決版数スコープ
      # 内の前方一致に限定する（イシュー #917）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-guardrail-regression-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-guardrail-regression-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-

      - name: 1 層目（REQ-4・判定器単体）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer1

      - name: 2 層目（REQ-5・除外適用後）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer2

      # 結果継続確認の一次可視化（実行日時・対象 commit SHA を run ごとに残す）。
      # 失敗検知の可視化そのものは後続 report ジョブが担う。
      - name: 結果サマリを記録
        if: always()
        run: |
          {
            echo "### guardrail 2 層検証（定期実行）"
            echo ""
            echo "- 実行日時（UTC）: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "- 対象 commit: ${GITHUB_SHA}"
            echo "- ジョブ結果: ${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # --------------------------------------------------
  # 失敗検知の可視化（scripts/report-guardrail-schedule-result.sh が単一ソース）
  # --------------------------------------------------
  report:
    name: 結果の可視化（失敗時 Issue 起票・復旧時クローズ）
    needs: [guardrail-regression-scheduled]
    # 上流ジョブが失敗・キャンセルされた場合にも必ず実行し、fail-closed で報告する
    # （.claude/rules/ci.md の ci-complete ジョブと同一方針）。
    if: ${{ always() }}
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #468）。issues:write
    # のみの最小昇格ジョブであり永続環境を必要としないため ubuntu-latest へ移行する。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Issue 起票・追記・クローズのみに限定して昇格する（.claude/rules/ci.md・security.md）。
      issues: write
    steps:
      - name: Checkout
        # スクリプト取得のみが目的で GITHUB_TOKEN を使う git 操作は行わないため
        # persist-credentials: false を維持する。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # ubuntu-latest には gh CLI がプリインストール済みのため本ステップは実質 no-op で
      # 通過する（イシュー #468・ホステッドランナー移行）。バージョン固定ダウンロードは
      # プリインストールされていない場合（ランナーイメージ変更等）のフェイルセーフとして
      # 維持する（冪等。$HOME 配下のみへの導入で使い捨て VM 外へ影響しない。
      # .claude/rules/ci.md の Ensure rustup / Ensure cargo-deny と同一方針）。
      # self-test 実行前に置く: self-test は gh をスタブ化して検証するため本ステップの
      # 有無を検知できず、また本ワークフローの report ジョブは push/PR 契機の CI（ci.yml）
      # では動かないため、バイナリ欠如は schedule/workflow_dispatch 実行で初めて
      # 顕在化する（レビュー指摘・#148）。self-test をゲートせず先に導入することで
      # gh 未導入環境でも self-test 自体が実行できることを保証する。
      # ubuntu-latest（linux）前提のため、Linux 版バイナリの取得のみに対応する。
      - name: Ensure gh is installed
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            GH_VERSION="2.97.0"
            ARCH=$(uname -m)
            case "${ARCH}" in
              x86_64) GH_ARCH=amd64 ;;
              aarch64) GH_ARCH=arm64 ;;
              *)
                echo "NG: 未対応アーキテクチャです: ${ARCH}" >&2
                exit 1
                ;;
            esac
            TMP_DIR=$(mktemp -d)
            trap 'rm -rf "${TMP_DIR}"' EXIT
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" \
              -o "${TMP_DIR}/gh.tar.gz"
            tar -xzf "${TMP_DIR}/gh.tar.gz" -C "${TMP_DIR}"
            mkdir -p "${HOME}/.local/bin"
            cp "${TMP_DIR}/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" "${HOME}/.local/bin/gh"
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          fi

      - name: 報告ロジックの self-test
        run: bash scripts/report-guardrail-schedule-result.sh self-test

      - name: 結果を Issue へ可視化
        env:
          RESULT: ${{ needs.guardrail-regression-scheduled.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/report-guardrail-schedule-result.sh report
