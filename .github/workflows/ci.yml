# fandhe-ai の品質ゲート CI。
#
# fmt / clippy / test / cargo-deny のベースライン品質ゲートは Fandhe-AI/actions の
# rust-base-ci reusable workflow（rust-ci ジョブ）へ集約した（イシュー #325。
# local-llm-server と同型だった重複ジョブ定義の解消）。Cargo.toml 有無を各ステップの
# `if:` で判定する自己修復方式・rust-toolchain.toml 同期・cargo-deny のバージョン
# 固定導入は共通 workflow 側の実装を参照（Fandhe-AI/actions の
# .github/workflows/rust-base-ci.yml および rust-base-ci/README.md）。
#
# リポジトリ固有ジョブ（build / build-no-cuda-toolkit / deps-forbidden / runner-policy /
# guardrail-regression / verification-gates）は引き続き本ファイルで定義する
# （permissions 最小・SHA 固定・concurrency 直列化・全ジョブ timeout-minutes 必須は
# 従来どおり .claude/rules/ci.md に従う）。各固有ジョブの Checkout 直後の `detect`
# ステップによる Cargo.toml 有無判定・`if: steps.detect.outputs.has_cargo == 'true'`
# ステップガードは、`Cargo.toml` 再消失時にもジョブを success のまま終了させる
# 冪等セルフヒール方針のフェイルセーフとして残置する（ジョブ単位の `if:` ではなく
# 各ステップの `if:` で判定しているのは、`jobs.<id>.if` は Checkout 前
# 〈ワークスペース展開前〉に評価されるため `hashFiles('Cargo.toml')` が常に空文字となり
# 判定できないため）。
#
# build / build-no-cuda-toolkit / deps-forbidden の 3 ジョブは、リポジトリ public 化に
# 伴う CI ホステッドランナー移行（トラッキング #457／Phase 2 親 #459。Phase 1〈#464〉で
# runner 方針が「public = ubuntu-latest 既定・self-hosted 禁止」へ反転済み）に対応し、
# `runs-on: ubuntu-latest`（使い捨て VM）へ移行済み（イシュー #466）。
# guardrail-regression・verification-gates・ci-complete も同設計を踏襲して
# `runs-on: ubuntu-latest` へ移行済み（イシュー #467。ci-complete の移行は PR #619
# 〈#466〉が「#467 または #468 消化時の対応が自然」と明示委譲した残件をここで引き取った）。
# これにより ci.yml 内の `runs-on: self-hosted` は解消済み。rust-ci ジョブの
# `runner-label` 入力（別スコープ〈イシュー #465〉）も `ubuntu-latest` へ切替済みで、
# ci.yml は self-hosted 参照を持たない（rust-ci 呼び出し先の共通側 reusable workflow
# 自体の入力既定値が `self-hosted` であることは別問題。「rust-base-ci reusable
# workflow」節参照）。
#
# 使い捨て VM ではジョブ間で依存解決・ビルド成果物を再利用できないため、上記の
# cargo 系ジョブ（rust-ci を除く 5 ジョブ）に `actions/cache`（SHA 固定）による 2 層
# キャッシュを導入する（#466 で確立し #467 が踏襲したキャッシュ設計）。rust-ci
# ジョブ（reusable workflow 呼び出し）は呼び出し側からステップを注入できないため
# 本節の対象外だが、共通側 `cache: true` 入力の有効化（#622）により同方針の
# キャッシュが共通側実装で有効化済み。詳細・#466 設計との差分と許容理由は
# rust-ci ジョブ直上のコメント参照:
#   - cargo registry（5 ジョブ共通・共有）: `~/.cargo/registry/{index,cache}/`・
#     `~/.cargo/git/db/` を対象に `cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}`
#     キーで保存・復元する。依存は `=x.y.z` 完全固定＋Cargo.lock コミット済み
#     （.claude/rules/deps-policy.md）のため、Cargo.lock のハッシュで依存セットが一意に
#     決まる。フルミス時は `restore-keys` の前方一致（`cargo-registry-${{ runner.os }}-`）で
#     直近キャッシュから部分復元する
#   - target（build・build-no-cuda-toolkit・guardrail-regression・verification-gates の
#     ジョブ別）: `target/` を対象に
#     `target-<job-id>-${{ runner.os }}-rustc<実解決版数>-clippy<実解決版数>-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}`
#     キーで保存・復元する（`<実解決版数>` は各ジョブの「toolchain 実解決版数の取得」
#     ステップが `rustc --version` / `cargo clippy --version` を実行して得る値）。
#     従来は `hashFiles('rust-toolchain.toml', 'Cargo.lock')` のみをキーに使い、
#     「stable のマイナー更新自体は cargo 側のフィンガープリント再ビルドで安全に処理
#     される」としていたが、`rust-toolchain.toml` は `channel = "stable"` のまま内容が
#     変化しないため toolchain 更新をキャッシュミスとして捕捉できず、この想定は実測で
#     反証された（clippy 1.98 の新規 lint 違反〈PR #914〉が main push CI のキャッシュ
#     命中により検出されず、キャッシュミスした別 PR ブランチで初めて顕在化。イシュー
#     #917）。実解決版数をキーへ組み込み、restore-keys も同一版数スコープの前方一致に
#     限定する（旧版数の target を新版数の run へ復元しない）ことで、toolchain 更新後の
#     最初の CI run では target キャッシュが構成上フルミスし、
#     `cargo clippy --workspace --all-targets --all-features` が全クレートを再検査する
#     ことを保証する。build（Linux debug + aarch64-apple-darwin クロス lib +
#     backend-metal check）・build-no-cuda-toolkit（Linux debug + test 成果物）・
#     guardrail-regression（guardrail クレートの debug テスト成果物）・
#     verification-gates（debug build + release test + clippy 成果物）で target 内容が
#     ジョブごとに異なるため分離する（混在させると復元・保存サイズが無駄に膨らむ。
#     verification-gates は他ジョブより成果物が大きくなりうるため、キャッシュ容量
#     〈リポジトリ上限・LRU 退避〉を圧迫する場合の縮小策〈release のみ保存する等〉は
#     #468 以降の判断に委ねる）
#   - deps-forbidden は `cargo tree`（依存解決・フェッチのみでビルドしない）のみ実行する
#     ため registry キャッシュのみとし target キャッシュは持たない
#   - ci-complete は checkout・toolchain セットアップを行わない判定専用ジョブのため
#     キャッシュを持たない
#   - 保存タイミングは `actions/cache` 既定（ジョブ成功時・完全一致キー存在時は再保存
#     なし）とする。ソース変更のみでは target キャッシュを更新しない設計であり、依存
#     コンパイルの再利用が支配的な高速化要因であるため、コミットごとの保存は
#     キャッシュ容量（リポジトリ上限・LRU 退避）の浪費になる
#   - verification-gates ジョブの target キャッシュのみ `actions/cache/restore` +
#     明示 `actions/cache/save` の分離構成を使う（ヒット種別ログ記録のため。イシュー
#     #919。alloc_tracker_serial.rs 間欠失敗のキャッシュ起因切り分け）。保存条件
#     （`cache-hit != 'true'` かつステップ既定の `success()`）は上記の複合アクション
#     既定と同値であり、他ジョブの target キャッシュは従来どおり複合アクションのまま
#     とする
#   - ブランチスコープ（GitHub Actions cache の既定挙動）: PR ブランチで保存した
#     キャッシュは当該 PR に閉じ、main（push トリガー）で保存したキャッシュが全 PR の
#     共通ベースになる。fork PR がベースキャッシュを汚染できない性質もこの既定挙動で
#     担保される（A08 ソフトウェア・データ整合性）
#
# deps-forbidden ジョブは TASK-1.2（依存禁止リストの CI 機械検査）の実装であり、
# scripts/check-forbidden-deps.sh（Makefile の deps-forbidden ターゲットと共用する単一
# ソース）経由で、Cargo.lock と cargo tree 出力の双方を対象に禁止クレート（burn 系一式・
# cubecl・candle・tch・ndarray。.claude/rules/deps-policy.md）の混入を fail-closed で検査
# する。検査ロジック自体の退行は scripts/testdata/ の固定 fixture による self-test で
# 毎回検出する。
#
# runner-policy ジョブ（イシュー #472）は、#457 Phase 2 で完了した
# self-hosted → ubuntu-latest 移行（.claude/rules/ci.md「runner」節）の逆戻り防止の
# ための fail-closed 契約検査である。scripts/check-workflow-runner-policy.sh
# （Makefile の runner-policy ターゲットと共用する単一ソース。検査本体は
# python3 標準ライブラリのみの check-workflow-runner-policy.py（追加パッケージ導入
# 不要。PyYAML 等の外部依存を使わない理由は同ファイル冒頭コメント参照）。PR #626
# レビュー指摘の YAML 表記トリック迂回を実パーサー方式で遮断）経由で、.github/workflows/ 配下に
# self-hosted が再導入されていないこと、runner 宣言（runs-on / runner-label /
# post-feedback-runner-label）が許容形リスト（標準 GitHub ホステッドランナーの
# `-latest` ラベル集合: ubuntu-latest・macos-latest・windows-latest）のいずれかとの
# 完全一致であることを検査する。deps-forbidden ジョブと同様、
# scripts/testdata/ の固定 fixture（clean/forbidden/unknown/trick-*/invalid）による self-test で
# 検査ロジック自体の退行を毎回検出する。codex-review wrapper の codex 実行ジョブ
# （runner-label 非指定＝reusable workflow 既定値 `codex` に委譲）は本リポ側ファイルに
# runner 宣言が現れないため自然に検査対象外となる（scripts/check-workflow-runner-policy.sh
# 冒頭コメント参照）。
#
# CUDA 実機（DGX Spark GB10）・Metal 実機依存のテストは #[ignore] で分離されている前提
# （.claude/rules/coding-rust.md）であり、本ワークフローでは実行しない。
#
# build-no-cuda-toolkit ジョブ（TASK-1.7d・イシュー #35）は、build ジョブとは異なり
# 「CUDA toolkit が非搭載であること自体」を scripts/check-cuda-toolkit-absent.sh の assert
# サブコマンドで fail-closed 検証したうえで cargo build を実行する。build ジョブは
# runner の toolkit 搭載状況に関わらず常に green になるため、「toolkit 非搭載環境での
# ビルド成立」という TASK-1.7 の維持条件（cudarc の dynamic-loading 動的ロード契約）を
# 暗黙の前提のまま検証されないリスクがある。本ジョブはその前提自体を機械検査に変える。
#
# build ジョブ（TASK-2.1b・イシュー #50）は「両プラットフォームで cargo build が green」
# という受け入れ条件に対応する。本ワークフローは macOS runner を一切使用せず全ジョブ
# ubuntu-latest 上で実行する構成のため（macos-latest 採否自体は #457 Phase 2 の枠外・
# 未検討。billing 等の追加考慮が必要）、macOS 検証は Linux runner 上の
# `aarch64-apple-darwin` クロスターゲットビルドで代替する。`cargo build --lib` は
# リンカを起動しないため、macOS SDK が無い Linux 上でも `cfg(target_os = "macos")` が
# 有効化され、objc2 / objc2-foundation / objc2-metal を含む Metal 有効経路のコンパイル
# 検証ができる（macOS 実機上の lib-only cargo build と同一のコンパイル検証。PoC-v2-5 の
# cfg ベースバックエンド切替構成）。guardrail クレート（TASK-4.1a・イシュー #104）が
# `[[bin]]` を持つため、`--workspace` に対する素の `cargo build` はバイナリのリンクを
# 試みて macOS 用クロスリンカ／SDK 非搭載の Linux runner 上で失敗する
# （`xcrun --sdk macosx --show-sdk-path` failed 等）。このため本ジョブの macOS ターゲット
# ビルドは `--lib` を付与し lib クレートのコンパイル検証のみに限定する。bin のリンクを
# 伴う検証が必要になった場合はクロスビルドでは不足するため、macOS 実機 runner
# （runner ラベル明示）の登録が別途必要（スコープ外。PR #303 参照）。
#
# TASK-1.8e（イシュー #42）で build ジョブへ追加した「cargo check（backend-metal の
# #[ignore] テスト・macOS ターゲット）」ステップは、上記 lib-only build の対象外である
# tests/（#[ignore] 実機テスト。crates/backend-metal/tests/）を型検査のみで検証する
# （cargo check はリンクを行わないため、test バイナリのリンクが未対応な上記制約下でも
# 成立する）。`--workspace --all-targets` ではなく `-p fandhe-ai-backend-metal --tests` に限定する
# 理由は docs/backend-metal-real-device-testing.md 参照（bench-harness の
# dev-dependencies 経由で criterion → alloca を引き込み、macOS クロスコンパイラ非搭載の
# Linux runner ではネイティブ C ビルドが失敗するため）。
#
# guardrail-regression ジョブ（TASK-6.1a・イシュー #147）は、guardrail 判定器の 2 層検証
# （REQ-4「判定器単体」・REQ-5「除外適用後」）を push/PR 契機で実行する。検証ロジックは
# scripts/run-guardrail-regression.sh（Makefile の guardrail-regression ターゲットと共用
# する単一ソース）に集約し、既存 test ジョブ（cargo test --workspace）とは独立したジョブ
# として可視化する（2 層検証の合否を単独で追跡可能にし、#148〈TASK-6.1b・schedule 定期
# 実行〉が同スクリプトを再利用できるようにするため）。テスト実体（TASK-4.2b/4.3a/5.3a/
# 5.3b/5.4a/5.4b）は既にマージ済みであり、本ジョブはその実行導線の新設に限る。
#
# verification-gates ジョブ（TASK-6.1c・イシュー #199）は、`docs/spec/04-requirements.md`
# が定める REQ-1 非機能要件「CI/CD への統合」節「REQ-3〜REQ-6 のガードレール（build/test/
# clippy/bench）は CI 上で自動実行可能な構成とすること」・前提条件節「検証済み AI 自律
# メンテナンス検証ゲート」の検証ゲート定義（節見出しを一次の参照点とする。
# scripts/run-verification-gates.sh 冒頭コメント参照）に対応する。検証ロジックは
# scripts/run-verification-gates.sh（Makefile の verification-gates ターゲットと共用する
# 単一ソース）に集約する。build/test/clippy の 3 ゲートを push/PR 契機で実行し、
# 「guardrail の検証ゲート列を単一ソースで traceable に実行する導線」（spec 準拠の
# release テストを含むゲート契約）として独立可視化する（既存 clippy/test ジョブと
# 一部重複するが、test サブコマンドは spec のゲート定義どおり --release を使う点が
# 既存 test ジョブ〈debug〉と異なる）。bench ゲートは実行時間を考慮し、独立 workflow
# `verification-gate-bench.yml`（schedule／workflow_dispatch 契機）に分離する
# （#148〈TASK-6.1b・schedule 定期実行〉と並行実装中のため、ci.yml への schedule 追加を
# 避けて衝突面を最小化する）。
#
# .github/workflows/guardrail-regression-schedule.yml（TASK-6.1b・イシュー #148）は、
# 本ジョブと同一の scripts/run-guardrail-regression.sh を schedule／workflow_dispatch
# 契機で再利用し、push/PR が無い期間も 2 層検証の正誤を定期的に確認する。失敗時の
# Issue 起票・復旧時のクローズを行う報告ロジック（scripts/report-guardrail-schedule-
# result.sh）自体の退行は、上記 self-test ステップで push/PR 契機に常時検知する。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # fmt / clippy / test / cargo-deny のベースライン品質ゲート（reusable workflow 呼び出し）。
  # 旧 fmt / clippy / test / deny の 4 ジョブ定義は Fandhe-AI/actions 側へ集約済み。
  # uses の参照は組織規約によりコミット SHA へ固定する（@main 禁止。更新時は
  # `gh api repos/Fandhe-AI/actions/commits/main --jq '.sha'` で解決した SHA へ差し替える）。
  # runner-label（ubuntu-latest。public 区分〈#457 Phase 1・#464〉への反転を明示する
  # オーバーライド。共通側入力の既定値は self-hosted）・deny-checks（advisories bans
  # licenses sources。共通側既定〈advisories licenses sources〉に bans を追加するため
  # 明示指定する。#353。advisories / bans の設定・違反 0 件の実測根拠は deny.toml の
  # [advisories] / [bans] 節コメント参照）・test-timeout-minutes（45。共通側既定 30
  # より長い移行前の値を維持。#465 の Phase 2 移行）・cache（true。#622。下記コメント
  # 参照）以外の入力（fmt/clippy/deny の timeout・cache-key-prefix 等）は、共通側の
  # 既定値が本リポジトリの意図と同一のため指定しない。concurrency は reusable
  # workflow のトップレベルでは機能しないため、従来どおり本ファイル冒頭の
  # concurrency 設定が直列化を担う。
  #
  # cache: true（#622。ホステッド〈使い捨て VM〉向けキャッシュ設計の確立）。
  # 共通側 `cache` 入力の既定値は self-hosted の永続 workspace 前提の `false` の
  # ため、ホステッドでのオーバーライドとして明示指定する（`type: boolean`。
  # pin SHA `fed9c07d`〈下記 uses 参照〉の共通側 workflow 定義で確認済み）。
  # reusable workflow は呼び出し側からステップを注入できない構造上の制約が
  # あるため、選択肢は「共通側 `cache` 入力の利用」か「共通側 Fandhe-AI/actions
  # の改修」の 2 つのみであり、共通側実装を実測確認したうえで前者を採用した
  # （#618 の rust-toolchain-setup 判断と同型）。
  # 共通側実装（Fandhe-AI/actions .github/workflows/rust-base-ci.yml、
  # pin SHA `fed9c07d` 時点）は `actions/cache`（SHA 固定 v6.1.0）を
  # `${{ inputs.cache-key-prefix }}-${{ runner.os }}-<job>-${{ hashFiles('**/Cargo.lock') }}`
  # キー（prefix 前方一致の restore-keys 付き）でジョブ別に有効化する設計であり、
  # 対象パスは fmt / clippy / test ジョブが
  # `~/.cargo/registry/index`・`~/.cargo/registry/cache`・`~/.cargo/git/db`・
  # `target` の 4 パス、deny ジョブは `cargo tree` 相当（依存解決のみでビルド
  # しない）のため `target` を含まない registry 3 パスのみ。下記の本ファイル側
  # キャッシュ（#466・#467）と同方針（ジョブ別キー分離・Cargo.lock ハッシュ・
  # prefix 前方一致・保存タイミングは actions/cache 既定・ブランチスコープに
  # よる fork PR 汚染防止）を持つ。`cache-key-prefix`（既定 `rust-base-ci`）は
  # 同一 self-hosted runner を複数リポジトリで共有する際の衝突回避用のため
  # ホステッド（リポジトリスコープの Actions cache）では不要と判断し既定のまま
  # 指定しない（二重管理回避の原則）。
  #
  # #466 設計との差分と許容理由（本ジョブは共通側実装に従うため下記は本リポ側で
  # 制御できない差分）:
  #   - target キーに toolchain 実解決版数（rustc/clippy version）を含まない:
  #     共通側キャッシュ restore ステップが toolchain setup より前にあり、
  #     reusable workflow の `with:` 入力は静的値のみで実行時コマンド出力を渡せない
  #     ため、呼び出し側からは共通側キーを修正できない構造的制約がある。この
  #     ギャップにより共通側 clippy ジョブは toolchain 更新後も target キャッシュが
  #     命中しうる（イシュー #917 で実測反証済み: PR #914 で clippy 1.98 の新規 lint
  #     違反が main push CI のキャッシュ命中により検出されなかった）。担保は本リポ
  #     固有の verification-gates ジョブ（ゲート 3/3）が同一コマンド
  #     〈`cargo clippy --workspace --all-targets --all-features -- -D warnings`〉で
  #     シャドーイングする設計に委ねる: verification-gates は target キーに実解決
  #     版数を含み（本ファイル冒頭のキャッシュ設計コメント参照）、toolchain 更新後の
  #     最初の run で構成上フルミス・全クレート再検査となるため、rust-ci 側の clippy
  #     が偽 green でも `ci-complete` が verification-gates の失敗を fail-closed に
  #     集約し CI run 全体としては検出できる。共通側（Fandhe-AI/actions）自体の改善
  #     （版数取得の cache 前移動・キーへの組み込み）は別リポジトリ作業のため
  #     Issue 起票にユーザー承認が要り（out-of-scope-tracking.md）本変更では見送る
  #   - `hashFiles('**/Cargo.lock')`（#466 側は `'Cargo.lock'`）: ルート単一
  #     Cargo.lock 構成＋submodule 非 checkout のため実質同一
  #   - fmt ジョブにも target を含むキャッシュがある: fmt はビルドしないため
  #     実質空キャッシュで無害（容量浪費は僅少）
  #   - cargo-deny バイナリ（`~/.cargo/bin`）はキャッシュ対象外（共通側の設計
  #     範囲。上記のとおり deny ジョブの cache path は registry のみ）:
  #     deny ジョブの timeout 既定は共通側 `deny-timeout-minutes` 入力で 20 分
  #     （pin SHA `fed9c07d` 時点の既定値。本ジョブでは未上書きのためそのまま
  #     適用）であり、cargo-deny 単体の所要時間はこれを十分下回るため現時点で
  #     恒常対策は不要と判断する。共通側改善は Issue 起票にユーザー承認が
  #     要るため本変更では見送る（out-of-scope-tracking.md）
  #
  # 前提1: runner に正常動作する rustup が導入済みであること。共通側 v1.2.0 以降、
  # rustup 不在時はネットワーク導入せず fail-closed で失敗する（Fandhe-AI/actions#86）。
  # 前提2: リポジトリルートの rust-toolchain.toml（共通側 rust-toolchain-setup が
  # 単一真実源として参照する。本移行で追加）。
  rust-ci:
    # reusable workflow は呼び出し側が付与した以上の権限を持てないため、
    # 共通側ジョブが必要とする最小権限をここでも付与する
    permissions:
      contents: read
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    with:
      # public 区分（GitHub ホステッド既定。#457 Phase 1・#464 で反転）。共通側入力の
      # 既定値は self-hosted のため、public 区分への反転を明示するオーバーライドとして
      # 必須（.claude/rules/ci.md）
      runner-label: ubuntu-latest
      # 共通側既定（advisories licenses sources）へ bans を追加（#353）。トークンは
      # 共通側 deny ジョブが閉じた whitelist と厳密一致で fail-closed 検証する
      deny-checks: advisories bans licenses sources
      # ホステッド（使い捨て VM）移行後も、まずは移行前と同じ 45 分を維持する
      # （共通側既定は 30 分）。#465 の PR #618 実測: rust-ci / cargo test は 2m9s
      # （04:18:38〜04:20:47 UTC。
      # https://github.com/Fandhe-AI/fandhe-ai/actions/runs/31769466364/job/94672194814）
      # であり 35 分を大幅に下回るため 45 分を維持で確定した（60 分への引き上げは不要）
      test-timeout-minutes: 45
      # ホステッド（使い捨て VM）向けキャッシュ設計の確立（#622）。詳細は本ジョブ
      # 直上のコメント参照
      cache: true

  # --------------------------------------------------
  # cargo build（TASK-2.1b・イシュー #50）。
  # Linux ホストビルドに加え、macOS runner 未登録の代替として aarch64-apple-darwin
  # クロスターゲットビルドで Metal 有効経路（cfg(target_os = "macos")）をコンパイル検証する
  # （詳細は本ファイル冒頭のコメント参照）。
  # --------------------------------------------------
  build:
    name: cargo build (linux / aarch64-apple-darwin)
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。使い捨て VM
    # のため actions/cache による依存・成果物の再利用を下記ステップで行う
    # （本ファイル冒頭コメントのキャッシュ設計参照）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build をスキップしました（workspace 作成後に有効化されます）"
          fi

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml（stable + rustfmt/clippy）へ同期する（rust-ci ジョブが使う
      # 共通側 composite action と同一実装。SHA はリリースタグ v1.1.0 の実コミットで固定
      # （`gh api repos/Fandhe-AI/actions/git/ref/tags/v1.1.0 --jq '.object.sha'` で解決）。
      # v1.1.0 以降、rustup 不在時はネットワーク導入せず fail-closed で失敗する）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # 共有ツールチェーンを不要に汚さないよう、未導入の場合のみ追加する（冪等。.claude/rules/ci.md）。
      - name: Ensure aarch64-apple-darwin target
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup target list --installed | grep -qx 'aarch64-apple-darwin' || rustup target add aarch64-apple-darwin

      # cargo registry（3 ジョブ共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      # SHA は v4 系最新タグ v4.3.0 を `gh api repos/actions/cache/git/refs/tags/v4.3.0`
      # で解決（追跡 ref: v4.3.0）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # toolchain 実解決版数の取得（イシュー #917）。rust-toolchain.toml は
      # `channel = "stable"` のまま内容が変化しないため、hashFiles ベースの target
      # キーだけでは stable 更新（clippy lint 集合の変化を伴う）をキャッシュミスとして
      # 捕捉できない（PR #914 で clippy 1.98 の新規 lint 違反が main push CI の
      # キャッシュ命中により検出されず、キャッシュミスした別 PR ブランチで初めて
      # 顕在化した実測に基づく）。rustc/clippy の実解決版数をキーへ組み込み、
      # toolchain 更新時に target キャッシュを構成上フルミスさせることで
      # `cargo clippy --workspace --all-targets --all-features` の全クレート再実行を
      # 保証する。空値・想定外形式のままキーへ混入すると版数なしキーへ縮退し
      # 偽陰性対策が無効化されるため、正規表現検証を通らない場合は fail-closed で
      # run を失敗させる。
      - name: toolchain 実解決版数の取得（target キャッシュキー用）
        id: toolchain-versions
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustc_ver="$(rustc --version | awk '{print $2}')"
          clippy_ver="$(cargo clippy --version | awk '{print $2}')"
          for v in "${rustc_ver}" "${clippy_ver}"; do
            printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.]+)?$' \
              || { echo "::error::toolchain 版数の取得に失敗: rustc=${rustc_ver} clippy=${clippy_ver}" >&2; exit 1; }
          done
          echo "rustc=${rustc_ver}" >> "${GITHUB_OUTPUT}"
          echo "clippy=${clippy_ver}" >> "${GITHUB_OUTPUT}"

      # target（build ジョブ専用。本ファイル冒頭コメントのキャッシュ設計参照）。
      # restore-keys は toolchain 実解決版数スコープ内の前方一致に限定する（旧版数の
      # target を新版数の run へ復元しない。イシュー #917）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-build-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-build-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-

      - name: cargo build（Linux ホスト）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（deny ジョブと同一方針）。
        run: cargo build --workspace --locked

      # guardrail クレートの `[[bin]]`（TASK-4.1a・イシュー #104）がリンクを要求すると
      # macOS 用クロスリンカ／SDK 非搭載の Linux runner 上で失敗するため、`--lib` で
      # lib クレートのコンパイル検証のみに限定する（本ファイル冒頭コメント参照）。
      - name: cargo build（macOS ターゲット・Metal 有効・lib のみ）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo build --workspace --locked --target aarch64-apple-darwin --lib

      # TASK-1.8e（イシュー #42）: backend-metal の #[ignore] 実機テスト（tests/）を
      # aarch64-apple-darwin で型検査する。`--workspace --all-targets` は
      # bench-harness の dev-dependencies 経由で criterion → alloca を引き込み、
      # macOS クロスコンパイラ非搭載の Linux runner では alloca のネイティブ
      # C ビルドが `cc: unrecognized option '-arch'` で失敗することを実測したため、
      # `-p fandhe-ai-backend-metal --tests` に限定する（bench-harness は backend-metal の
      # dev-dependencies 経由では [dependencies] のみが解決され criterion を含まない。
      # Makefile の check-cross-metal-tests と同一コマンド）。cargo check はリンクを
      # 行わないため macOS SDK 非搭載でも成立する（上の build ステップとは異なり
      # cargo build ではなく cargo check である点に注意）。
      - name: cargo check（backend-metal の #[ignore] テスト・macOS ターゲット）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo check -p fandhe-ai-backend-metal --tests --target aarch64-apple-darwin

      # イシュー #753 レビュー指摘（codex-review P2）: `backend-cpu::gemm_blis::cache_params`
      # モジュールは本番未結線のため `#[cfg(test)]` 限定でしかコンパイルされず、内部の
      # `sysctl_ffi`（`cfg(target_os = "macos")` 限定）は Linux CI の通常
      # `cargo test`（`target_os != "macos"`）では到達しない。上記 backend-metal と同じ
      # 手法（`--tests` で cfg(test) を有効にしたまま aarch64-apple-darwin へクロス型検査）
      # で `sysctl_ffi` を継続的コンパイル検証の対象に含める（Makefile の
      # check-cross-cpu-tests と同一コマンド）。cargo check はリンクを行わないため
      # macOS SDK 非搭載でも成立する。
      - name: cargo check（backend-cpu の cfg(test) 限定コード・macOS ターゲット）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo check -p fandhe-ai-backend-cpu --tests --target aarch64-apple-darwin

      # rustdoc 警告ゲート（イシュー #883）。crates.io 公開クレートの docs.rs
      # ビルド成立性（受け入れ条件 b）を CI で常時検査する。cfg（aarch64 NEON vs
      # x86 AVX・macOS 限定モジュール）により警告集合がターゲットごとに異なる
      # ため、Linux ホスト分・aarch64-apple-darwin クロス分の両方をゲートする
      # （docs/crates-io-publishing-order.md「公開前検証手順と実測記録」参照）。
      # `--no-deps` は依存クレート自体の doc 生成をスキップするがメタデータ
      # ビルドは要るため、上の cargo build/check 群と同じくリンクなしで成立する。
      - name: cargo doc（rustdoc 警告ゲート・Linux ホスト）
        if: steps.detect.outputs.has_cargo == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      # macOS ターゲット分は `--workspace` にしない: guardrail の `[[bin]]`
      # がリンクを要求すると macOS クロスリンカ非搭載の Linux runner 上で
      # 失敗しうる（上の「cargo build（macOS ターゲット・Metal 有効・lib
      # のみ）」step が `--lib` に限定している理由と同じ懸念）。cfg 分岐で
      # 警告集合が実際に変わるのは aarch64 NEON／macOS 限定モジュールを持つ
      # backend-cpu・backend-metal の 2 クレートのみ（他クレートの警告は
      # target 非依存）のため、この 2 クレートに限定してゲートする。
      - name: cargo doc（rustdoc 警告ゲート・macOS ターゲット）
        if: steps.detect.outputs.has_cargo == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p fandhe-ai-backend-metal -p fandhe-ai-backend-cpu --no-deps --locked --target aarch64-apple-darwin

  # --------------------------------------------------
  # CUDA toolkit 非搭載環境でのビルド・実行成立検証（TASK-1.7d・イシュー #35／
  # TASK-2.3・イシュー #56）。
  # scripts/check-cuda-toolkit-absent.sh（Makefile の build-no-cuda ターゲットと共用する
  # 単一ソース）で「toolkit 非搭載であること自体」を fail-closed で検証したうえで
  # cargo build を実行する。runner に将来 toolkit が導入された場合はこのジョブが失敗し、
  # コンテナ内検証への切替が必要になったことを検知できる。
  #
  # TASK-2.3 は spec 上「cuda feature を含まない構成」の検証を求めるが、backend-cuda は
  # TASK-2.1（#48）で正式化した feature フラグなしの cfg ベース構成（PoC-v2-5）を採用して
  # おり feature 分岐自体が存在しないため、「CUDA toolkit 非搭載環境でのビルド・実行成立」
  # に読み替える（spec 自体が PoC-v2-3 の動的ロード方式に基づくと明記しており検証実体は
  # 一致する。docs/spec/ は編集しない）。
  #
  # 実行検証（cargo test）は既存 test ジョブ（TASK-1.7〜1.9d）と責務が異なる: test ジョブは
  # runner の toolkit 搭載状況を assert しないため、runner に toolkit が導入されると
  # 「非搭載環境での実行成立」の検証が暗黙に消える（#35 がビルドに対して解決したのと同型の
  # 問題の実行版）。本ジョブは上記 assert 済みの前提下で cargo test を実行することで、
  # cudarc の dynamic-loading 経由で CudaDevice::is_available() が false に縮退し、
  # CudaError::DriverUnavailable へ型付きエラーとして落ちる分岐（panic しない契約）と、
  # backend-cpu・tensor-core を含む workspace 全体の実行成立を担保する。
  # --------------------------------------------------
  build-no-cuda-toolkit:
    name: cargo build / test (CUDA toolkit 非搭載検証)
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。ubuntu-latest
    # 標準イメージは CUDA toolkit 非搭載であり、本ジョブが検証する前提
    # （scripts/check-cuda-toolkit-absent.sh assert）と自然に合致する。
    runs-on: ubuntu-latest
    # test ステップ追加により既存 test ジョブの上限（45 分）に整合させる。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行を、実環境の toolkit 有無に関わらず常時検出する
      # （deps-forbidden ジョブと同一方針）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-cuda-toolkit-absent.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build（toolkit 非搭載検証）をスキップしました（workspace 作成後に有効化されます）"
          fi

      # fail-closed: runner に toolkit が導入されていれば「非搭載環境での検証」という
      # 本ジョブの前提が成立しないため、cargo build の前に明示的に失敗させる。
      - name: CUDA toolkit 非搭載の検証
        run: bash scripts/check-cuda-toolkit-absent.sh assert

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（build ジョブと同一方針。本ファイル冒頭コメント参照）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo registry（3 ジョブ共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # toolchain 実解決版数の取得（イシュー #917。build ジョブと同一契約。
      # 版数取得ステップの意図・fail-closed の理由は build ジョブのコメント参照）。
      - name: toolchain 実解決版数の取得（target キャッシュキー用）
        id: toolchain-versions
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustc_ver="$(rustc --version | awk '{print $2}')"
          clippy_ver="$(cargo clippy --version | awk '{print $2}')"
          for v in "${rustc_ver}" "${clippy_ver}"; do
            printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.]+)?$' \
              || { echo "::error::toolchain 版数の取得に失敗: rustc=${rustc_ver} clippy=${clippy_ver}" >&2; exit 1; }
          done
          echo "rustc=${rustc_ver}" >> "${GITHUB_OUTPUT}"
          echo "clippy=${clippy_ver}" >> "${GITHUB_OUTPUT}"

      # target（build-no-cuda-toolkit ジョブ専用。本ファイル冒頭コメントのキャッシュ設計参照）。
      # restore-keys は toolchain 実解決版数スコープ内の前方一致に限定する（イシュー #917）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-build-no-cuda-toolkit-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-build-no-cuda-toolkit-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-

      - name: cargo build（toolkit 非搭載）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（build ジョブと同一方針）。
        run: cargo build --workspace --locked

      # TASK-2.3（#56）: assert 済みの toolkit 非搭載前提下で非 #[ignore] テストを実行し、
      # 「ビルド成立」だけでなく「実行成立」（DriverUnavailable への型付きエラー縮退・
      # backend-cpu 経由の演算実行を含む）を検証する。実機必須テストは #[ignore] 分離済み
      # のため非搭載 runner でも green になる設計（.claude/rules/coding-rust.md）。
      - name: cargo test（toolkit 非搭載）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace --locked

  # --------------------------------------------------
  # 依存禁止リストの機械検査（TASK-1.2・REQ-1）。
  # Cargo.lock を対象に、禁止クレート（burn 系一式・cubecl・candle・tch・ndarray。
  # .claude/rules/deps-policy.md）が推移的依存を含めて混入していないことを検査する。
  # cargo 不要（grep のみ）のため rustup セットアップは行わない。
  # --------------------------------------------------
  deps-forbidden:
    name: forbidden dependencies check
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。
    runs-on: ubuntu-latest
    # cargo tree 検査（cargo フェッチ・解決を伴う）を追加したため 10 → 15 に引き上げる。
    # OSS 直接比較ハーネスの cargo-deny 監査ステップ（`cargo install cargo-deny` の
    # ソースビルドを含む）を追加したため 15 → 25 に引き上げる（イシュー #755
    # review 対応・ユーザー承認条件「ライセンス監査を CI に組み込む」）。
    # OSS 直接比較ハーネスのテスト実行ステップ（`cargo test --release`。stride
    # 契約回帰テストを CI 上で実行するため。Cursor Bugbot 指摘対応）を追加したため
    # 25 → 30 に引き上げる。
    # advisories/bans を監査範囲へ追加（PR #770 review 指摘 P1 対応）したことで
    # RUSTSEC アドバイザリ DB の初回 clone が加わるため 30 → 35 に引き上げる
    # （ルート deny ジョブの `deny-timeout-minutes` 既定 20 分と同様の余裕を確保）。
    # フレームワーク横並びベンチ（framework-compare）の cargo-deny 監査
    # （634 パッケージのメタデータ解決・フェッチ）と bench-common テストを追加した
    # ため 35 → 45 に引き上げる（PR #915 Cursor Bugbot 指摘対応）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（正規表現の破損・grep 消失等）を、実データの有無に関わらず
      # 常時検出する（受け入れ条件「禁止クレート混入時に fail-closed で失敗する」の機械検証。
      # scripts/check-forbidden-deps.sh self-test）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-forbidden-deps.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
          fi

      # 本体 workspace ルート Cargo.lock・OSS 直接比較ハーネス
      # （scripts/bench/oss-gemm-compare/。許容依存第 9 区分・イシュー #755。
      # `docs/oss-comparison-harness-decision.md`）の Cargo.lock を一括検査する。
      # 対象パスの列挙は scripts/check-forbidden-deps.sh 側（lock-all サブコマンド）に
      # 集約済みで、ここではパスをハードコードしない（Makefile の deps-forbidden
      # ターゲットと同一スクリプト・同一サブコマンドを共用し二重管理しない。
      # 第 9 区分有効化のマージ条件「scripts/check-forbidden-deps.sh の走査対象化」の
      # 実体。.claude/rules/deps-policy.md）。ルート Cargo.lock 未追加時の notice
      # スキップ・ハーネス Cargo.lock 不在時の fail-closed は lock-all 内部の挙動。
      - name: Cargo.lock 群の依存禁止検査（本体 workspace・OSS 直接比較ハーネス）
        run: bash scripts/check-forbidden-deps.sh lock-all

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（build ジョブと同一方針。本ファイル冒頭コメント参照）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo registry のみ（cargo tree は依存解決・フェッチのみでビルドしないため target
      # キャッシュは不要。本ファイル冒頭コメントのキャッシュ設計参照）。
      # 本ジョブはルート workspace に加えて第 9 区分ハーネス
      # （oss-gemm-compare・framework-compare）の依存もフェッチするため、キーの
      # hashFiles に両ハーネスの Cargo.lock を含めたジョブ専用キーとする（共有キー
      # `cargo-registry-<os>-<root lock>` のままだと完全一致ヒット時に再保存されず、
      # ハーネス依存（framework-compare は 634 パッケージ）が永続的にキャッシュへ
      # 入らない。PR #915 Cursor Bugbot 指摘対応）。restore-keys の前方一致で
      # 他ジョブの共有キャッシュからの部分復元は従来どおり効く。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-deps-forbidden-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/bench/oss-gemm-compare/Cargo.lock', 'scripts/bench/framework-compare/Cargo.lock') }}
          restore-keys: |
            cargo-registry-deps-forbidden-${{ runner.os }}-
            cargo-registry-${{ runner.os }}-

      - name: cargo tree の依存禁止検査
        # Cargo.lock の grep 検査を補強し、cargo tree の依存解決結果（features・build
        # 依存・cfg(target_os = "macos") 限定の Metal 系依存を含む）に対しても検査する
        # （TASK-1.2 の成果物「cargo tree 出力の禁止クレート grep 検査」）。
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/check-forbidden-deps.sh tree

      # OSS 直接比較ハーネス（scripts/bench/oss-gemm-compare/）専用の依存監査
      # （イシュー #755 review 指摘対応・ユーザー承認条件「ライセンス監査を CI に
      # 組み込む」の実体）。本パッケージは本体 workspace の member ではないため
      # ルート `deny.toml`（rust-ci ジョブ経由の cargo-deny）の走査対象に含まれず、
      # 従来は手動実行のみだった（`docs/oss-comparison-harness-decision.md`）。
      # ここでは本パッケージ専用の `deny.toml`（advisories・bans・licenses・sources。
      # 同ファイル冒頭コメント参照。PR #770 review 指摘 P1 対応・2026-08-20 ユーザー
      # 承認で advisories/bans へ監査範囲を拡張し `RUSTSEC-2024-0436`〈`paste`
      # unmaintained・`gemm =0.19.0` の推移的依存・アップグレード先なし〉を理由
      # コメント付きで ignore 登録済み）を対象に
      # `cargo deny check advisories bans licenses sources` を実行する。
      # cargo-deny バイナリのバージョンをキャッシュキーに含める（CI 実障害の原因調査・
      # イシュー #755 review 指摘対応）。従来はバージョン非固定（`cargo install
      # cargo-deny --locked` のみ）かつキャッシュキーにバージョンを含めていなかった
      # ため、過去に一度キャッシュされた古い cargo-deny バイナリ（`check` サブコマンド
      # 配下で `--config` を受け付けない版）が永続的に再利用され、コマンド呼び出し側
      # の引数順序（`check --config ...`）を先に正しく直しても
      # `error: unexpected argument '--config' found` で fail し続けていた（実行ログ
      # 実測: run 32325590243 job 96296066750。ローカルで同一コマンドを cargo-deny
      # 0.19.8 で実行すると `licenses ok, sources ok` で成功することを確認済み）。
      # バージョンを明示固定しキャッシュキーへ含めることで、バージョン変更時に
      # 確実にキャッシュが再構築されるようにする。
      - name: cargo-deny バイナリのキャッシュ
        if: steps.detect.outputs.has_cargo == 'true'
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-${{ runner.os }}-0.19.8

      - name: Ensure cargo-deny（未導入時のみソースビルド。lefthook/Makefile と同一の冪等パターン）
        if: steps.detect.outputs.has_cargo == 'true' && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version =0.19.8 --locked

      - name: OSS 直接比較ハーネスの依存監査（advisories/bans/licenses/sources）
        # --config は `check` サブコマンドのオプションのため `check` の後に置く
        # （`cargo-deny --help` 実測: トップレベルには存在せず `check --config` のみ
        # 有効）。明示しないと cargo-deny は既定でカレントディレクトリ（リポジトリ
        # ルート）の deny.toml を探索してしまい、本パッケージ専用の
        # scripts/bench/oss-gemm-compare/deny.toml が使われずルート deny.toml が
        # 誤って適用される（--manifest-path は対象 Cargo.toml/Cargo.lock の指定のみで
        # config 探索には影響しない。イシュー #755 review 指摘対応）。
        # advisories/bans を含めるのは PR #770 review 指摘 P1 対応（2026-08-20
        # ユーザー承認）。ローカルで
        # `cargo deny --manifest-path ... --locked check --config ...
        # advisories bans licenses sources` が
        # `advisories ok, bans ok, licenses ok, sources ok` を返すことを実測確認済み。
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          cargo deny --manifest-path scripts/bench/oss-gemm-compare/Cargo.toml \
            --locked check \
            --config scripts/bench/oss-gemm-compare/deny.toml \
            advisories bans licenses sources

      # OSS 直接比較ハーネスのテスト実行（Cursor Bugbot 指摘対応。イシュー #755）。
      # 本パッケージは本体 workspace の member ではない独立 Cargo プロジェクトのため、
      # ルート `cargo test`（rust-ci ジョブ・reusable workflow 側）のビルド対象には
      # 一切現れず、`src/main.rs` の stride 契約回帰テスト（`gemm::gemm` が A*B を
      # 計算し B*A ではないことを証明するテスト。review P1 指摘対応）が PR 上で
      # 一度も実行されないまま埋没する欠落があった。本パッケージ専用の Cargo.lock を
      # 対象に `--locked` でテストを実行し、CI 上で毎回検証する。
      - name: OSS 直接比較ハーネスのテスト実行
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --manifest-path scripts/bench/oss-gemm-compare/Cargo.toml --locked --release

      # フレームワーク横並びベンチ（scripts/bench/framework-compare/。許容依存第 9 区分の
      # 適用範囲拡張。PR #915・`docs/framework-compare-harness-decision.md`）専用の
      # 依存監査。本 workspace は本体 workspace の member ではないためルート
      # `deny.toml` の走査対象に含まれない。専用の
      # scripts/bench/framework-compare/deny.toml（advisories・bans・licenses・
      # sources。比較対象の推移的依存に含まれる MPL-2.0/CC0-1.0/BSL-1.0 の許容と
      # RUSTSEC ignore の理由は同ファイルのコメント参照）を対象に監査する。
      # cargo deny はメタデータ解決のみでビルドしないため burn / candle の
      # コンパイルは発生しない。
      - name: フレームワーク横並びベンチの依存監査（advisories/bans/licenses/sources）
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          cargo deny --manifest-path scripts/bench/framework-compare/Cargo.toml \
            --locked check \
            --config scripts/bench/framework-compare/deny.toml \
            advisories bans licenses sources

      # フレームワーク横並びベンチの共有ロジック（bench-common: RNG 決定性・分位点
      # 統計・typed error）の回帰テスト。bench-burn / bench-candle まで含めた
      # workspace 全体のビルドは burn / candle の大規模な依存コンパイルになるため
      # CI では bench-common（外部依存ゼロ）に限定する（計測バイナリ自体のビルドは
      # 実測キャンペーン時にローカルで行う。README 参照）。
      - name: フレームワーク横並びベンチ bench-common のテスト実行
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --manifest-path scripts/bench/framework-compare/bench-common/Cargo.toml --locked --release

      # イシュー #970: summarize.py の要素単位検証（parity_status 等）の
      # 回帰テスト。python3 標準ライブラリの unittest のみ（追加依存なし）で、
      # cargo の有無に関わらず常時実行する（deps-forbidden ジョブの他の
      # python3 実行ステップと同一方針）。
      - name: フレームワーク横並びベンチ summarize.py の単体テスト
        run: python3 -m unittest scripts/bench/framework-compare/summarize_test.py

      # イシュー #1083: compare_ab.py（都度同期廃止〈#1011〉の実践規模 A/B
      # 比較ヘルパー）の回帰テスト。summarize_test.py と同一方針（stdlib の
      # unittest のみ・cargo の有無に関わらず常時実行）。
      - name: フレームワーク横並びベンチ compare_ab.py の単体テスト
        run: python3 -m unittest scripts/bench/framework-compare/compare_ab_test.py

      # イシュー #1142・#1147: compare_gemm_gate.py（GEMM 目標達成ゲート
      # CUDA #1031／Metal #1037 の 5 回計測中央値集計・`--device` 切替判定）の
      # 回帰テスト。summarize_test.py・compare_ab_test.py と同一方針（stdlib の
      # unittest のみ・cargo の有無に関わらず常時実行）。
      - name: フレームワーク横並びベンチ compare_gemm_gate.py の単体テスト
        run: python3 -m unittest scripts/bench/framework-compare/compare_gemm_gate_test.py

  # --------------------------------------------------
  # self-hosted runner 逆戻り防止の fail-closed 契約検査（イシュー #472）。
  # #457 Phase 2（#465〜#469）で .github/workflows/ の全ジョブが runs-on: ubuntu-latest へ
  # 移行完了した（.claude/rules/ci.md「runner」節）が、以後 self-hosted を再導入しても
  # 機械的に検知する仕組みがなかった。scripts/check-workflow-runner-policy.sh
  # （Makefile の runner-policy ターゲットと共用する単一ソース。検査本体は python3
  # 標準ライブラリのみの check-workflow-runner-policy.py。追加パッケージ導入不要。
  # PyYAML 等の外部依存を使わない理由は同ファイル冒頭コメント参照）経由で、デコード後の
  # YAML 構造に対する self-hosted 出現・許容形リスト（標準 GitHub ホステッドランナーの
  # `-latest` ラベル集合: ubuntu-latest・macos-latest・windows-latest）以外の runner
  # 宣言を fail-closed で検査する
  # （PR #626 レビュー指摘の YAML 表記トリック迂回を実パーサー方式で遮断）。
  # cargo 不要のため rustup セットアップは行わない。
  # --------------------------------------------------
  runner-policy:
    name: workflow runner policy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（正規表現の破損等）を、実データの有無に関わらず常時検出する
      # （受け入れ条件「検査自体の self-test がある」の機械検証。deps-forbidden ジョブと
      # 同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/check-workflow-runner-policy.sh self-test

      - name: .github/workflows/ の runner 契約検査
        run: bash scripts/check-workflow-runner-policy.sh check

  # --------------------------------------------------
  # guardrail 判定器の 2 層検証（TASK-6.1a・イシュー #147）。
  # REQ-4（1 層目・判定器単体）・REQ-5（2 層目・除外適用後）の回帰テストを
  # scripts/run-guardrail-regression.sh 経由で実行する（本ファイル冒頭コメント参照）。
  # --------------------------------------------------
  guardrail-regression:
    name: guardrail 2 層検証（REQ-4/REQ-5）
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #467）。使い捨て VM
    # のため actions/cache による依存の再利用を下記ステップで行う
    # （本ファイル冒頭コメントのキャッシュ設計参照。#466 で確立した build 系ジョブと
    # 同一方針を踏襲する）。
    runs-on: ubuntu-latest
    # guardrail クレート単体のビルド・テストのみのため、test ジョブ（45 分）より短く設定する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（テストファイル・fixture の無言削除／リネーム）を、
      # 実行環境の cargo 有無に関わらず常時検出する（deps-forbidden ジョブと同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/run-guardrail-regression.sh self-test

      # guardrail-regression-schedule.yml の report ジョブが使う報告ロジック
      # （scripts/report-guardrail-schedule-result.sh）自体の退行を、schedule 発火を
      # 待たず push/PR 契機で常時検知する（TASK-6.1b・#148。ネットワーク不要・cargo 不要）。
      - name: schedule 結果報告ロジックの self-test
        run: bash scripts/report-guardrail-schedule-result.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため guardrail 2 層検証をスキップしました（workspace 作成後に有効化されます）"
          fi

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（build ジョブと同一方針。本ファイル冒頭コメント参照）。
      # 旧「Ensure rustup is installed」「Sync toolchain」の 2 手動ステップを置換する。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo registry（build 系ジョブと共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # toolchain 実解決版数の取得（イシュー #917。build ジョブと同一契約。
      # guardrail-regression-schedule.yml も本ジョブとキーを共有するため同期必須）。
      - name: toolchain 実解決版数の取得（target キャッシュキー用）
        id: toolchain-versions
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustc_ver="$(rustc --version | awk '{print $2}')"
          clippy_ver="$(cargo clippy --version | awk '{print $2}')"
          for v in "${rustc_ver}" "${clippy_ver}"; do
            printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.]+)?$' \
              || { echo "::error::toolchain 版数の取得に失敗: rustc=${rustc_ver} clippy=${clippy_ver}" >&2; exit 1; }
          done
          echo "rustc=${rustc_ver}" >> "${GITHUB_OUTPUT}"
          echo "clippy=${clippy_ver}" >> "${GITHUB_OUTPUT}"

      # target（guardrail-regression ジョブ専用。guardrail クレートの debug テスト
      # 成果物のみのため他ジョブと内容が異なり分離する。本ファイル冒頭コメント参照）。
      # restore-keys は toolchain 実解決版数スコープ内の前方一致に限定する（イシュー #917）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-guardrail-regression-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-guardrail-regression-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-

      - name: 1 層目（REQ-4・判定器単体）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer1

      - name: 2 層目（REQ-5・除外適用後）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer2

  # --------------------------------------------------
  # AI 自律メンテナンス検証ゲート（build/test/clippy。TASK-6.1c・イシュー #199）。
  # scripts/run-verification-gates.sh（Makefile の verification-gates ターゲットと共用
  # する単一ソース）経由で self-test → build → test → clippy を直列実行する
  # （本ファイル冒頭コメント参照）。bench ゲートは verification-gate-bench.yml
  # （schedule／workflow_dispatch）に分離する。
  # --------------------------------------------------
  verification-gates:
    name: 検証ゲート（build/test/clippy）
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #467）。使い捨て VM
    # のため actions/cache による依存の再利用を下記ステップで行う
    # （本ファイル冒頭コメントのキャッシュ設計参照。#466 で確立した build 系ジョブと
    # 同一方針を踏襲する）。
    runs-on: ubuntu-latest
    # test サブコマンドが --release を使うため、既存 test ジョブ（45 分）と同等以上を確保する。
    timeout-minutes: 60
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（bench ワークロード example の無言削除・リネーム）を、
      # 実行環境の cargo 有無に関わらず常時検出する（deps-forbidden ジョブと同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/run-verification-gates.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため検証ゲートをスキップしました（workspace 作成後に有効化されます）"
          fi

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml（stable + rustfmt/clippy）へ同期する（build ジョブと同一方針。
      # 本ファイル冒頭コメント参照）。旧「Ensure rustup is installed」「Sync toolchain」
      # 「Ensure clippy component」の 3 手動ステップを置換する。clippy component は
      # rust-toolchain.toml の components 列挙（単一真実源）経由で rust-toolchain-setup
      # が同期するため、手動 Ensure ステップは不要になる。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo registry（build 系ジョブと共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # toolchain 実解決版数の取得（イシュー #917。build ジョブと同一契約。
      # verification-gates は clippy ゲート〈ゲート 3/3〉を担うジョブそのものであり、
      # 本ステップが偽陰性対策の要となる）。
      - name: toolchain 実解決版数の取得（target キャッシュキー用）
        id: toolchain-versions
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustc_ver="$(rustc --version | awk '{print $2}')"
          clippy_ver="$(cargo clippy --version | awk '{print $2}')"
          for v in "${rustc_ver}" "${clippy_ver}"; do
            printf '%s' "${v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.]+)?$' \
              || { echo "::error::toolchain 版数の取得に失敗: rustc=${rustc_ver} clippy=${clippy_ver}" >&2; exit 1; }
          done
          echo "rustc=${rustc_ver}" >> "${GITHUB_OUTPUT}"
          echo "clippy=${clippy_ver}" >> "${GITHUB_OUTPUT}"

      # target（verification-gates ジョブ専用。debug build + release test + clippy の
      # 成果物を含み他ジョブと内容が大きく異なるため分離する。本ファイル冒頭コメント参照。
      # キャッシュ容量〈リポジトリ上限・LRU 退避〉を圧迫する場合は release のみ保存する等の
      # 縮小策を #468 以降で検討する）。restore-keys は toolchain 実解決版数スコープ内の
      # 前方一致に限定する（イシュー #917）。
      #
      # イシュー #919: alloc_tracker_serial.rs の間欠失敗（PR #914 で black_box 観測点を
      # 追加済みだが根本原因未確定）の有力仮説の 1 つが、本キャッシュの restore-keys
      # 前方一致フォールバック（古い Cargo.lock／toolchain 世代の target/ への増分ビルド）
      # 起因説。複合アクション `actions/cache` は cache-hit（完全一致の真偽のみ）しか
      # 出力せず完全一致・接頭辞一致・ミスを区別できないため、`actions/cache/restore` +
      # 明示 `actions/cache/save` に分離してヒット種別を判別可能にする。
      # 同一 SHA（v4.3.0）のサブパスを使うため SHA 固定規約（.claude/rules/ci.md）は
      # 維持したまま新規 action 追加なしで実現する。
      - name: Cache cargo target（restore）
        id: cache-target-restore
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-verification-gates-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-verification-gates-${{ runner.os }}-rustc${{ steps.toolchain-versions.outputs.rustc }}-clippy${{ steps.toolchain-versions.outputs.clippy }}-

      # target キャッシュ復元結果の記録（イシュー #919）。
      # cache-matched-key が空なら miss、cache-primary-key と一致すれば exact、
      # それ以外は restore-keys 前方一致フォールバックによる prefix ヒットと判定する
      # （target/ の有無を見るヒューリスティックではなく restore サブアクションの出力を
      # 直接使うため推定なしで正確に分類できる）。判定結果はゲートの成否に一切影響させず
      # 情報記録専用とする。式はインジェクション対策の慣行として env 経由で受け渡す。
      - name: target キャッシュ復元結果の記録（イシュー #919）
        if: steps.detect.outputs.has_cargo == 'true'
        env:
          PRIMARY_KEY: ${{ steps.cache-target-restore.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.cache-target-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -z "${MATCHED_KEY}" ]; then
            HIT_KIND="miss"
          elif [ "${MATCHED_KEY}" = "${PRIMARY_KEY}" ]; then
            HIT_KIND="exact"
          else
            HIT_KIND="prefix（restore-keys フォールバック）"
          fi
          echo "::notice::target キャッシュヒット種別（イシュー #919）: ${HIT_KIND} / primary=${PRIMARY_KEY} / matched=${MATCHED_KEY}"
          {
            echo "### target キャッシュ復元結果（イシュー #919）"
            echo ""
            echo "| 項目 | 値 |"
            echo "|------|-----|"
            echo "| ヒット種別 | ${HIT_KIND} |"
            echo "| primary key | \`${PRIMARY_KEY}\` |"
            echo "| matched key | \`${MATCHED_KEY}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: ゲート 1/3（build）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh build

      - name: ゲート 2/3（test --release）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh test

      - name: ゲート 3/3（clippy）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh clippy

      # target キャッシュの保存（イシュー #919。restore/save 分離構成の対）。
      # 完全一致時（cache-hit == 'true'）は再保存しない・ジョブ成功時のみ保存という、
      # 複合アクション `actions/cache` 既定の保存セマンティクス（本ファイル冒頭コメント
      # 「保存タイミング」節）と同値になるよう、ステップ既定の success() に加えて
      # cache-hit を明示検査する。key は cache-primary-key を再参照し hashFiles の
      # 二重計算を避ける。
      - name: Cache cargo target（save）
        if: steps.detect.outputs.has_cargo == 'true' && steps.cache-target-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: ${{ steps.cache-target-restore.outputs.cache-primary-key }}

  # --------------------------------------------------
  # 集約ジョブ。branch protection（ruleset main-protection・id 20587668）は
  # ci-complete を核としつつ、needs 配下の個別ジョブも required contexts に
  # 重複列挙するのが正式構成（implement-issue-tree の G0 ゲート要件。#629。
  # 詳細は .claude/rules/ci.md「ワークフロー設計」節を正とする）。
  # bare needs は skipped も success 扱いになるため、明示的に result を検査して
  # fail-closed で判定する（.claude/rules/ci.md）。
  # --------------------------------------------------
  ci-complete:
    name: ci-complete
    # public 化に伴うホステッドランナー移行（#457 Phase 2）。判定のみのジョブのため
    # checkout・toolchain セットアップは不要（PR #619〈#466〉が明示委譲した残件を
    # イシュー #467 で引き取り、ci.yml 内の self-hosted ジョブを解消済み）。
    runs-on: ubuntu-latest
    # 判定のみのジョブのため権限は一切不要（workflow レベルの contents: read も継承しない）。
    permissions: {}
    # 失敗・スキップ時にも必ず実行して fail-closed で判定する。
    if: ${{ always() }}
    # ジョブを追加したら必ずこの needs（および下の完遂判定の検査対象）へ追加する。
    # あわせて ruleset main-protection（20587668）の required contexts の更新も必要
    # （人間承認が要る運用上の GitHub 設定変更。詳細は .claude/rules/ci.md 参照）。
    needs: [rust-ci, build, build-no-cuda-toolkit, deps-forbidden, runner-policy, guardrail-regression, verification-gates]
    timeout-minutes: 5
    steps:
      - name: 完遂判定（全 needs ジョブが success であること）
        env:
          # rust-ci は reusable workflow 呼び出しのため、result は共通側の全ジョブ
          # （fmt / clippy / test / deny / rust-base-ci-complete）を集約した結果になる
          RESULT_RUST_CI: ${{ needs.rust-ci.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_BUILD_NO_CUDA_TOOLKIT: ${{ needs.build-no-cuda-toolkit.result }}
          RESULT_DEPS_FORBIDDEN: ${{ needs.deps-forbidden.result }}
          RESULT_RUNNER_POLICY: ${{ needs.runner-policy.result }}
          RESULT_GUARDRAIL_REGRESSION: ${{ needs.guardrail-regression.result }}
          RESULT_VERIFICATION_GATES: ${{ needs.verification-gates.result }}
        run: |
          set -euo pipefail
          ok=1
          for pair in "rust-ci:${RESULT_RUST_CI}" "build:${RESULT_BUILD}" "build-no-cuda-toolkit:${RESULT_BUILD_NO_CUDA_TOOLKIT}" "deps-forbidden:${RESULT_DEPS_FORBIDDEN}" "runner-policy:${RESULT_RUNNER_POLICY}" "guardrail-regression:${RESULT_GUARDRAIL_REGRESSION}" "verification-gates:${RESULT_VERIFICATION_GATES}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "NG: ${name} = ${result}"
              ok=0
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "一部ジョブが success ではありません" >&2
            exit 1
          fi
          echo "全ジョブ success"
