# rust-ai-library の品質ゲート CI。
#
# Fandhe-AI/rust-ai-library-v1・local-llm-server・fandhe-multi-platform の ci.yml
# （self-hosted 前提・permissions 最小・SHA 固定・concurrency 直列化・Cargo.toml 検出ガード）
# と同一方針に揃える（.claude/rules/ci.md）。
#
# workspace `Cargo.toml`（TASK-1.1）は追加済みで、fmt / clippy / test / 依存禁止検査の
# cargo 系ステップは実行され green である（run 31058207909 で確認済み。イシュー #6）。
# 各ジョブの Checkout 直後の `detect` ステップによる Cargo.toml 有無判定・
# `if: steps.detect.outputs.has_cargo == 'true'` ステップガードは、`Cargo.toml` 再消失時にも
# ジョブを success のまま終了させる冪等セルフヒール方針（.claude/rules/ci.md）のフェイルセーフ
# として残置する（ロジックは変更しない）。ジョブ単位の `if:` ではなく各ステップの `if:` で
# 判定しているのは、`jobs.<id>.if` は Checkout 前（ワークスペース展開前）に評価されるため
# `hashFiles('Cargo.toml')` が常に空文字となり判定できないため。`deny.toml`（TASK-1.3）も
# 追加済みのため deny ジョブは実行される。detect ガードはいずれかが再消失した場合の
# フェイルセーフとして残置する。
#
# deps-forbidden ジョブは TASK-1.2（依存禁止リストの CI 機械検査）の実装であり、
# scripts/check-forbidden-deps.sh（Makefile の deps-forbidden ターゲットと共用する単一
# ソース）経由で、Cargo.lock と cargo tree 出力の双方を対象に禁止クレート（burn 系一式・
# cubecl・candle・tch・ndarray。.claude/rules/deps-policy.md）の混入を fail-closed で検査
# する。検査ロジック自体の退行は scripts/testdata/ の固定 fixture による self-test で
# 毎回検出する。
#
# CUDA 実機（DGX Spark GB10）・Metal 実機依存のテストは #[ignore] で分離されている前提
# （.claude/rules/coding-rust.md）であり、本ワークフローでは実行しない。
#
# build-no-cuda-toolkit ジョブ（TASK-1.7d・イシュー #35）は、build ジョブとは異なり
# 「CUDA toolkit が非搭載であること自体」を scripts/check-cuda-toolkit-absent.sh の assert
# サブコマンドで fail-closed 検証したうえで cargo build を実行する。build ジョブは
# runner の toolkit 搭載状況に関わらず常に green になるため、「toolkit 非搭載環境での
# ビルド成立」という TASK-1.7 の維持条件（cudarc の dynamic-loading 動的ロード契約）を
# 暗黙の前提のまま検証されないリスクがある。本ジョブはその前提自体を機械検査に変える。
#
# build ジョブ（TASK-2.1b・イシュー #50）は「両プラットフォームで cargo build が green」
# という受け入れ条件に対応する。macOS 側 self-hosted runner は未登録（repo レベル runner
# 0 件・既存ジョブは全て Linux self-hosted 上で実行）であり、GitHub ホステッド
# macos-latest は使用禁止（.claude/rules/ci.md）のため、macOS 検証は Linux runner 上の
# `aarch64-apple-darwin` クロスターゲットビルドで代替する。全 9 クレートは lib のみ
# （[[bin]] なし）で `cargo build` はリンカを起動しないため、macOS SDK が無い Linux 上でも
# `cfg(target_os = "macos")` が有効化され、objc2 / objc2-foundation / objc2-metal を含む
# Metal 有効経路のコンパイルが検証できる（macOS 実機上の lib-only cargo build と同一の
# コンパイル検証。PoC-v2-5 の cfg ベースバックエンド切替構成）。将来 [[bin]] や test
# バイナリのリンクを伴う検証が必要になった場合はクロスビルドでは不足するため、
# macOS 実機 runner（runner ラベル明示）の登録が別途必要（スコープ外。PR 本文参照）。
#
# TASK-1.8e（イシュー #42）で build ジョブへ追加した「cargo check（backend-metal の
# #[ignore] テスト・macOS ターゲット）」ステップは、上記 lib-only build の対象外である
# tests/（#[ignore] 実機テスト。crates/backend-metal/tests/）を型検査のみで検証する
# （cargo check はリンクを行わないため、test バイナリのリンクが未対応な上記制約下でも
# 成立する）。`--workspace --all-targets` ではなく `-p backend-metal --tests` に限定する
# 理由は docs/backend-metal-real-device-testing.md 参照（bench-harness の
# dev-dependencies 経由で criterion → alloca を引き込み、macOS クロスコンパイラ非搭載の
# self-hosted runner ではネイティブ C ビルドが失敗するため）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # cargo fmt --check（整形差分の検出）
  # --------------------------------------------------
  fmt:
    name: cargo fmt --check
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（v1 / local-llm-server の ci.yml と同一 SHA に固定）。
        # docs/spec サブモジュールは fmt/clippy/test に不要なため取得しない（既定で submodules: false）。
        # persist-credentials: false: checkout 後どのステップも GITHUB_TOKEN を使わないため、
        # 共有 self-hosted runner の workspace にトークンを残留させない。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo fmt --check をスキップしました（workspace 作成後に有効化されます）"
          fi

      # self-hosted runner に rustup が未導入/欠落している場合に備え、後続ステップの
      # 前提を自己修復する。導入済みなら何もしない（冪等。.claude/rules/ci.md）。
      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      # 共有ツールチェーンを不要に汚さないよう、未導入の場合のみ追加する（冪等）。
      - name: Ensure rustfmt component
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup component list --installed | grep -q '^rustfmt' || rustup component add rustfmt

      - name: cargo fmt --check
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo fmt --all --check

  # --------------------------------------------------
  # cargo clippy -- -D warnings（lint ゲート）
  # --------------------------------------------------
  clippy:
    name: cargo clippy
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo clippy をスキップしました（workspace 作成後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: Ensure clippy component
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup component list --installed | grep -q '^clippy' || rustup component add clippy

      - name: cargo clippy
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # --------------------------------------------------
  # cargo test（実機依存の #[ignore] テストは除く）
  # --------------------------------------------------
  test:
    name: cargo test
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo test をスキップしました（workspace 作成後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: cargo test
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace --all-features

  # --------------------------------------------------
  # cargo build（TASK-2.1b・イシュー #50）。
  # Linux ホストビルドに加え、macOS runner 未登録の代替として aarch64-apple-darwin
  # クロスターゲットビルドで Metal 有効経路（cfg(target_os = "macos")）をコンパイル検証する
  # （詳細は本ファイル冒頭のコメント参照）。
  # --------------------------------------------------
  build:
    name: cargo build (linux / aarch64-apple-darwin)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build をスキップしました（workspace 作成後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      # 共有ツールチェーンを不要に汚さないよう、未導入の場合のみ追加する（冪等。.claude/rules/ci.md）。
      - name: Ensure aarch64-apple-darwin target
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup target list --installed | grep -qx 'aarch64-apple-darwin' || rustup target add aarch64-apple-darwin

      - name: cargo build（Linux ホスト）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（deny ジョブと同一方針）。
        run: cargo build --workspace --locked

      - name: cargo build（macOS ターゲット・Metal 有効）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo build --workspace --locked --target aarch64-apple-darwin

      # TASK-1.8e（イシュー #42）: backend-metal の #[ignore] 実機テスト（tests/）を
      # aarch64-apple-darwin で型検査する。`--workspace --all-targets` は
      # bench-harness の dev-dependencies 経由で criterion → alloca を引き込み、
      # macOS クロスコンパイラ非搭載の self-hosted runner では alloca のネイティブ
      # C ビルドが `cc: unrecognized option '-arch'` で失敗することを実測したため、
      # `-p backend-metal --tests` に限定する（bench-harness は backend-metal の
      # dev-dependencies 経由では [dependencies] のみが解決され criterion を含まない。
      # Makefile の check-cross-metal-tests と同一コマンド）。cargo check はリンクを
      # 行わないため macOS SDK 非搭載でも成立する（上の build ステップとは異なり
      # cargo build ではなく cargo check である点に注意）。
      - name: cargo check（backend-metal の #[ignore] テスト・macOS ターゲット）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo check -p backend-metal --tests --target aarch64-apple-darwin

  # --------------------------------------------------
  # CUDA toolkit 非搭載環境でのビルド成立検証（TASK-1.7d・イシュー #35）。
  # scripts/check-cuda-toolkit-absent.sh（Makefile の build-no-cuda ターゲットと共用する
  # 単一ソース）で「toolkit 非搭載であること自体」を fail-closed で検証したうえで
  # cargo build を実行する。runner に将来 toolkit が導入された場合はこのジョブが失敗し、
  # コンテナ内検証への切替が必要になったことを検知できる。
  # --------------------------------------------------
  build-no-cuda-toolkit:
    name: cargo build (CUDA toolkit 非搭載検証)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行を、実環境の toolkit 有無に関わらず常時検出する
      # （deps-forbidden ジョブと同一方針）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-cuda-toolkit-absent.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build（toolkit 非搭載検証）をスキップしました（workspace 作成後に有効化されます）"
          fi

      # fail-closed: runner に toolkit が導入されていれば「非搭載環境での検証」という
      # 本ジョブの前提が成立しないため、cargo build の前に明示的に失敗させる。
      - name: CUDA toolkit 非搭載の検証
        run: bash scripts/check-cuda-toolkit-absent.sh assert

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: cargo build（toolkit 非搭載）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（build ジョブと同一方針）。
        run: cargo build --workspace --locked

  # --------------------------------------------------
  # cargo deny（依存ライセンス・供給元の監査。deny.toml 追加済み・TASK-1.3 で有効化済み）
  # --------------------------------------------------
  deny:
    name: cargo deny check licenses sources
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml と deny.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ] && [ -f "deny.toml" ]; then
            echo "has_deny=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_deny=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml または deny.toml が未追加のため cargo deny をスキップしました（TASK-1.3 のライセンス整備後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_deny == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_deny == 'true'
        run: rustup show

      # 未導入の場合のみソースビルドで導入する（冪等。.claude/rules/ci.md）。
      - name: Ensure cargo-deny is installed
        if: steps.detect.outputs.has_deny == 'true'
        run: |
          set -euo pipefail
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked

      # --locked で Cargo.lock の書き換え・runner 汚染を防止する。
      - name: cargo deny check licenses sources
        if: steps.detect.outputs.has_deny == 'true'
        run: cargo deny --locked check licenses sources

  # --------------------------------------------------
  # 依存禁止リストの機械検査（TASK-1.2・REQ-1）。
  # Cargo.lock を対象に、禁止クレート（burn 系一式・cubecl・candle・tch・ndarray。
  # .claude/rules/deps-policy.md）が推移的依存を含めて混入していないことを検査する。
  # cargo 不要（grep のみ）のため rustup セットアップは行わない。
  # --------------------------------------------------
  deps-forbidden:
    name: forbidden dependencies check
    runs-on: self-hosted
    # cargo tree 検査（cargo フェッチ・解決を伴う）を追加したため 10 → 15 に引き上げる。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（正規表現の破損・grep 消失等）を、実データの有無に関わらず
      # 常時検出する（受け入れ条件「禁止クレート混入時に fail-closed で失敗する」の機械検証。
      # scripts/check-forbidden-deps.sh self-test）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-forbidden-deps.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cargo.lock の依存禁止検査
        run: |
          set -euo pipefail
          if [ ! -f "Cargo.lock" ]; then
            echo "::notice::Cargo.lock が未追加のため依存禁止検査をスキップしました（workspace 作成後に有効化されます）"
            exit 0
          fi
          bash scripts/check-forbidden-deps.sh lock Cargo.lock

      # self-hosted runner に rustup が未導入/欠落している場合に備え、後続ステップの
      # 前提を自己修復する（fmt ジョブと同一方針。冪等。.claude/rules/ci.md）。
      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: cargo tree の依存禁止検査
        # Cargo.lock の grep 検査を補強し、cargo tree の依存解決結果（features・build
        # 依存・cfg(target_os = "macos") 限定の Metal 系依存を含む）に対しても検査する
        # （TASK-1.2 の成果物「cargo tree 出力の禁止クレート grep 検査」）。
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/check-forbidden-deps.sh tree

  # --------------------------------------------------
  # 集約ジョブ（branch protection の required status check はこのジョブのみを指定する）。
  # bare needs は skipped も success 扱いになるため、明示的に result を検査して
  # fail-closed で判定する（.claude/rules/ci.md）。
  # --------------------------------------------------
  ci-complete:
    name: ci-complete
    runs-on: self-hosted
    # 失敗・スキップ時にも必ず実行して fail-closed で判定する。
    if: ${{ always() }}
    needs: [fmt, clippy, test, build, build-no-cuda-toolkit, deny, deps-forbidden]
    timeout-minutes: 5
    steps:
      - name: 完遂判定（全 needs ジョブが success であること）
        env:
          RESULT_FMT: ${{ needs.fmt.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_BUILD_NO_CUDA_TOOLKIT: ${{ needs.build-no-cuda-toolkit.result }}
          RESULT_DENY: ${{ needs.deny.result }}
          RESULT_DEPS_FORBIDDEN: ${{ needs.deps-forbidden.result }}
        run: |
          set -euo pipefail
          ok=1
          for pair in "fmt:${RESULT_FMT}" "clippy:${RESULT_CLIPPY}" "test:${RESULT_TEST}" "build:${RESULT_BUILD}" "build-no-cuda-toolkit:${RESULT_BUILD_NO_CUDA_TOOLKIT}" "deny:${RESULT_DENY}" "deps-forbidden:${RESULT_DEPS_FORBIDDEN}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "NG: ${name} = ${result}"
              ok=0
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "一部ジョブが success ではありません" >&2
            exit 1
          fi
          echo "全ジョブ success"
