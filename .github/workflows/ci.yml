# rust-ai-library の品質ゲート CI。
#
# fmt / clippy / test / cargo-deny のベースライン品質ゲートは Fandhe-AI/actions の
# rust-base-ci reusable workflow（rust-ci ジョブ）へ集約した（イシュー #325。
# local-llm-server と同型だった重複ジョブ定義の解消）。Cargo.toml 有無を各ステップの
# `if:` で判定する自己修復方式・rustup の冪等セルフヒール・cargo-deny のバージョン
# 固定導入は共通 workflow 側の実装を参照（Fandhe-AI/actions の
# .github/workflows/rust-base-ci.yml および rust-base-ci/README.md）。
#
# リポジトリ固有ジョブ（build / build-no-cuda-toolkit / deps-forbidden /
# guardrail-regression / verification-gates）は引き続き本ファイルで定義する
# （permissions 最小・SHA 固定・concurrency 直列化・全ジョブ timeout-minutes 必須は
# 従来どおり .claude/rules/ci.md に従う）。各固有ジョブの Checkout 直後の `detect`
# ステップによる Cargo.toml 有無判定・`if: steps.detect.outputs.has_cargo == 'true'`
# ステップガードは、`Cargo.toml` 再消失時にもジョブを success のまま終了させる
# 冪等セルフヒール方針のフェイルセーフとして残置する（ジョブ単位の `if:` ではなく
# 各ステップの `if:` で判定しているのは、`jobs.<id>.if` は Checkout 前
# 〈ワークスペース展開前〉に評価されるため `hashFiles('Cargo.toml')` が常に空文字となり
# 判定できないため）。
#
# build / build-no-cuda-toolkit / deps-forbidden の 3 ジョブは、リポジトリ public 化に
# 伴う CI ホステッドランナー移行（トラッキング #457／Phase 2 親 #459。Phase 1〈#464〉で
# runner 方針が「public = ubuntu-latest 既定・self-hosted 禁止」へ反転済み）に対応し、
# `runs-on: ubuntu-latest`（使い捨て VM）へ移行済み（イシュー #466）。
# guardrail-regression・verification-gates・ci-complete は #467／#468 の別スコープとして
# 引き続き self-hosted のまま残る（本ファイルの当該ブロックは本イシューでは変更しない）。
#
# 使い捨て VM ではジョブ間で依存解決・ビルド成果物を再利用できないため、上記 3 ジョブに
# `actions/cache`（SHA 固定）による 2 層キャッシュを導入する（後続 #467／#468 が踏襲する
# キャッシュ設計）:
#   - cargo registry（3 ジョブ共通・共有）: `~/.cargo/registry/{index,cache}/`・
#     `~/.cargo/git/db/` を対象に `cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}`
#     キーで保存・復元する。依存は `=x.y.z` 完全固定＋Cargo.lock コミット済み
#     （.claude/rules/deps-policy.md）のため、Cargo.lock のハッシュで依存セットが一意に
#     決まる。フルミス時は `restore-keys` の前方一致（`cargo-registry-${{ runner.os }}-`）で
#     直近キャッシュから部分復元する
#   - target（build・build-no-cuda-toolkit のジョブ別）: `target/` を対象に
#     `target-<job-id>-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}`
#     キーで保存・復元する。toolchain 定義変更時に古い rustc の成果物へ増分ビルドしない
#     ためキーに `rust-toolchain.toml` を含める（stable のマイナー更新自体は cargo 側の
#     フィンガープリント再ビルドで安全に処理される）。build（Linux debug +
#     aarch64-apple-darwin クロス lib + backend-metal check）と build-no-cuda-toolkit
#     （Linux debug + test 成果物）で target 内容が異なるためジョブ別に分離する
#     （混在させると復元・保存サイズが無駄に膨らむ）
#   - deps-forbidden は `cargo tree`（依存解決・フェッチのみでビルドしない）のみ実行する
#     ため registry キャッシュのみとし target キャッシュは持たない
#   - 保存タイミングは `actions/cache` 既定（ジョブ成功時・完全一致キー存在時は再保存
#     なし）とする。ソース変更のみでは target キャッシュを更新しない設計であり、依存
#     コンパイルの再利用が支配的な高速化要因であるため、コミットごとの保存は
#     キャッシュ容量（リポジトリ上限・LRU 退避）の浪費になる
#   - ブランチスコープ（GitHub Actions cache の既定挙動）: PR ブランチで保存した
#     キャッシュは当該 PR に閉じ、main（push トリガー）で保存したキャッシュが全 PR の
#     共通ベースになる。fork PR がベースキャッシュを汚染できない性質もこの既定挙動で
#     担保される（A08 ソフトウェア・データ整合性）
#
# deps-forbidden ジョブは TASK-1.2（依存禁止リストの CI 機械検査）の実装であり、
# scripts/check-forbidden-deps.sh（Makefile の deps-forbidden ターゲットと共用する単一
# ソース）経由で、Cargo.lock と cargo tree 出力の双方を対象に禁止クレート（burn 系一式・
# cubecl・candle・tch・ndarray。.claude/rules/deps-policy.md）の混入を fail-closed で検査
# する。検査ロジック自体の退行は scripts/testdata/ の固定 fixture による self-test で
# 毎回検出する。
#
# CUDA 実機（DGX Spark GB10）・Metal 実機依存のテストは #[ignore] で分離されている前提
# （.claude/rules/coding-rust.md）であり、本ワークフローでは実行しない。
#
# build-no-cuda-toolkit ジョブ（TASK-1.7d・イシュー #35）は、build ジョブとは異なり
# 「CUDA toolkit が非搭載であること自体」を scripts/check-cuda-toolkit-absent.sh の assert
# サブコマンドで fail-closed 検証したうえで cargo build を実行する。build ジョブは
# runner の toolkit 搭載状況に関わらず常に green になるため、「toolkit 非搭載環境での
# ビルド成立」という TASK-1.7 の維持条件（cudarc の dynamic-loading 動的ロード契約）を
# 暗黙の前提のまま検証されないリスクがある。本ジョブはその前提自体を機械検査に変える。
#
# build ジョブ（TASK-2.1b・イシュー #50）は「両プラットフォームで cargo build が green」
# という受け入れ条件に対応する。macOS 側 self-hosted runner は未登録（repo レベル runner
# 0 件・既存ジョブは全て Linux self-hosted 上で実行）であり、GitHub ホステッド
# macos-latest は使用禁止（.claude/rules/ci.md）のため、macOS 検証は Linux runner 上の
# `aarch64-apple-darwin` クロスターゲットビルドで代替する。`cargo build --lib` は
# リンカを起動しないため、macOS SDK が無い Linux 上でも `cfg(target_os = "macos")` が
# 有効化され、objc2 / objc2-foundation / objc2-metal を含む Metal 有効経路のコンパイル
# 検証ができる（macOS 実機上の lib-only cargo build と同一のコンパイル検証。PoC-v2-5 の
# cfg ベースバックエンド切替構成）。guardrail クレート（TASK-4.1a・イシュー #104）が
# `[[bin]]` を持つため、`--workspace` に対する素の `cargo build` はバイナリのリンクを
# 試みて macOS 用クロスリンカ／SDK 非搭載の Linux runner 上で失敗する
# （`xcrun --sdk macosx --show-sdk-path` failed 等）。このため本ジョブの macOS ターゲット
# ビルドは `--lib` を付与し lib クレートのコンパイル検証のみに限定する。bin のリンクを
# 伴う検証が必要になった場合はクロスビルドでは不足するため、macOS 実機 runner
# （runner ラベル明示）の登録が別途必要（スコープ外。PR #303 参照）。
#
# TASK-1.8e（イシュー #42）で build ジョブへ追加した「cargo check（backend-metal の
# #[ignore] テスト・macOS ターゲット）」ステップは、上記 lib-only build の対象外である
# tests/（#[ignore] 実機テスト。crates/backend-metal/tests/）を型検査のみで検証する
# （cargo check はリンクを行わないため、test バイナリのリンクが未対応な上記制約下でも
# 成立する）。`--workspace --all-targets` ではなく `-p backend-metal --tests` に限定する
# 理由は docs/backend-metal-real-device-testing.md 参照（bench-harness の
# dev-dependencies 経由で criterion → alloca を引き込み、macOS クロスコンパイラ非搭載の
# self-hosted runner ではネイティブ C ビルドが失敗するため）。
#
# guardrail-regression ジョブ（TASK-6.1a・イシュー #147）は、guardrail 判定器の 2 層検証
# （REQ-4「判定器単体」・REQ-5「除外適用後」）を push/PR 契機で実行する。検証ロジックは
# scripts/run-guardrail-regression.sh（Makefile の guardrail-regression ターゲットと共用
# する単一ソース）に集約し、既存 test ジョブ（cargo test --workspace）とは独立したジョブ
# として可視化する（2 層検証の合否を単独で追跡可能にし、#148〈TASK-6.1b・schedule 定期
# 実行〉が同スクリプトを再利用できるようにするため）。テスト実体（TASK-4.2b/4.3a/5.3a/
# 5.3b/5.4a/5.4b）は既にマージ済みであり、本ジョブはその実行導線の新設に限る。
#
# verification-gates ジョブ（TASK-6.1c・イシュー #199）は、`docs/spec/04-requirements.md`
# が定める REQ-1 非機能要件「CI/CD への統合」節「REQ-3〜REQ-6 のガードレール（build/test/
# clippy/bench）は CI 上で自動実行可能な構成とすること」・前提条件節「検証済み AI 自律
# メンテナンス検証ゲート」の検証ゲート定義（節見出しを一次の参照点とする。
# scripts/run-verification-gates.sh 冒頭コメント参照）に対応する。検証ロジックは
# scripts/run-verification-gates.sh（Makefile の verification-gates ターゲットと共用する
# 単一ソース）に集約する。build/test/clippy の 3 ゲートを push/PR 契機で実行し、
# 「guardrail の検証ゲート列を単一ソースで traceable に実行する導線」（spec 準拠の
# release テストを含むゲート契約）として独立可視化する（既存 clippy/test ジョブと
# 一部重複するが、test サブコマンドは spec のゲート定義どおり --release を使う点が
# 既存 test ジョブ〈debug〉と異なる）。bench ゲートは実行時間を考慮し、独立 workflow
# `verification-gate-bench.yml`（schedule／workflow_dispatch 契機）に分離する
# （#148〈TASK-6.1b・schedule 定期実行〉と並行実装中のため、ci.yml への schedule 追加を
# 避けて衝突面を最小化する）。
#
# .github/workflows/guardrail-regression-schedule.yml（TASK-6.1b・イシュー #148）は、
# 本ジョブと同一の scripts/run-guardrail-regression.sh を schedule／workflow_dispatch
# 契機で再利用し、push/PR が無い期間も 2 層検証の正誤を定期的に確認する。失敗時の
# Issue 起票・復旧時のクローズを行う報告ロジック（scripts/report-guardrail-schedule-
# result.sh）自体の退行は、上記 self-test ステップで push/PR 契機に常時検知する。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # fmt / clippy / test / cargo-deny のベースライン品質ゲート（reusable workflow 呼び出し）。
  # 旧 fmt / clippy / test / deny の 4 ジョブ定義は Fandhe-AI/actions 側へ集約済み。
  # uses の参照は組織規約によりコミット SHA へ固定する（@main 禁止。更新時は
  # `gh api repos/Fandhe-AI/actions/commits/main --jq '.sha'` で解決した SHA へ差し替える）。
  # runner-label（ubuntu-latest。public 区分〈#457 Phase 1・#464〉への反転を明示する
  # オーバーライド。共通側入力の既定値は self-hosted）・deny-checks（advisories bans
  # licenses sources。共通側既定〈advisories licenses sources〉に bans を追加するため
  # 明示指定する。#353。advisories / bans の設定・違反 0 件の実測根拠は deny.toml の
  # [advisories] / [bans] 節コメント参照）・test-timeout-minutes（45。共通側既定 30
  # より長い移行前の値を維持。#465 の Phase 2 移行）以外の入力（fmt/clippy/deny の
  # timeout・cache〈false。ホステッド（使い捨て VM）向けのキャッシュ設計〈キー構成・
  # restore-keys〉は #466（build 系 3 ジョブのみが対象で本ジョブはスコープ外）とは別に
  # #622 で確立する〉）は、共通側の既定値が本リポジトリの意図と
  # 同一のため指定しない。concurrency は reusable workflow の
  # トップレベルでは機能しないため、従来どおり本ファイル冒頭の concurrency 設定が
  # 直列化を担う。
  # 前提: リポジトリルートの rust-toolchain.toml（共通側 rust-toolchain-setup が
  # 単一真実源として参照する。本移行で追加）。
  rust-ci:
    # reusable workflow は呼び出し側が付与した以上の権限を持てないため、
    # 共通側ジョブが必要とする最小権限をここでも付与する
    permissions:
      contents: read
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
    with:
      # public 区分（GitHub ホステッド既定。#457 Phase 1・#464 で反転）。共通側入力の
      # 既定値は self-hosted のため、public 区分への反転を明示するオーバーライドとして
      # 必須（.claude/rules/ci.md）
      runner-label: ubuntu-latest
      # 共通側既定（advisories licenses sources）へ bans を追加（#353）。トークンは
      # 共通側 deny ジョブが閉じた whitelist と厳密一致で fail-closed 検証する
      deny-checks: advisories bans licenses sources
      # ホステッド（使い捨て VM）移行後も、まずは移行前と同じ 45 分を維持する
      # （共通側既定は 30 分）。#465 の PR CI 実測（コールドスタートの所要時間）を見て、
      # 35 分以下なら 45 分を維持・超過なら 60 分へ引き上げ、
      # .claude/rules/ci.md 側の記述も同一 PR で同期更新する
      test-timeout-minutes: 45

  # --------------------------------------------------
  # cargo build（TASK-2.1b・イシュー #50）。
  # Linux ホストビルドに加え、macOS runner 未登録の代替として aarch64-apple-darwin
  # クロスターゲットビルドで Metal 有効経路（cfg(target_os = "macos")）をコンパイル検証する
  # （詳細は本ファイル冒頭のコメント参照）。
  # --------------------------------------------------
  build:
    name: cargo build (linux / aarch64-apple-darwin)
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。使い捨て VM
    # のため actions/cache による依存・成果物の再利用を下記ステップで行う
    # （本ファイル冒頭コメントのキャッシュ設計参照）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build をスキップしました（workspace 作成後に有効化されます）"
          fi

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml（stable + rustfmt/clippy）へ同期する（rust-ci ジョブが使う
      # 共通側 composite action と同一実装。SHA は
      # `gh api repos/Fandhe-AI/actions/commits/main --jq '.sha'` で解決。追跡 ref: main）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@39d6d5cfd275338ec2e4bcead179b6a017712772 # main

      # 共有ツールチェーンを不要に汚さないよう、未導入の場合のみ追加する（冪等。.claude/rules/ci.md）。
      - name: Ensure aarch64-apple-darwin target
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup target list --installed | grep -qx 'aarch64-apple-darwin' || rustup target add aarch64-apple-darwin

      # cargo registry（3 ジョブ共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      # SHA は v4 系最新タグ v4.3.0 を `gh api repos/actions/cache/git/refs/tags/v4.3.0`
      # で解決（追跡 ref: v4.3.0）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # target（build ジョブ専用。本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-build-${{ runner.os }}-

      - name: cargo build（Linux ホスト）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（deny ジョブと同一方針）。
        run: cargo build --workspace --locked

      # guardrail クレートの `[[bin]]`（TASK-4.1a・イシュー #104）がリンクを要求すると
      # macOS 用クロスリンカ／SDK 非搭載の Linux runner 上で失敗するため、`--lib` で
      # lib クレートのコンパイル検証のみに限定する（本ファイル冒頭コメント参照）。
      - name: cargo build（macOS ターゲット・Metal 有効・lib のみ）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo build --workspace --locked --target aarch64-apple-darwin --lib

      # TASK-1.8e（イシュー #42）: backend-metal の #[ignore] 実機テスト（tests/）を
      # aarch64-apple-darwin で型検査する。`--workspace --all-targets` は
      # bench-harness の dev-dependencies 経由で criterion → alloca を引き込み、
      # macOS クロスコンパイラ非搭載の self-hosted runner では alloca のネイティブ
      # C ビルドが `cc: unrecognized option '-arch'` で失敗することを実測したため、
      # `-p backend-metal --tests` に限定する（bench-harness は backend-metal の
      # dev-dependencies 経由では [dependencies] のみが解決され criterion を含まない。
      # Makefile の check-cross-metal-tests と同一コマンド）。cargo check はリンクを
      # 行わないため macOS SDK 非搭載でも成立する（上の build ステップとは異なり
      # cargo build ではなく cargo check である点に注意）。
      - name: cargo check（backend-metal の #[ignore] テスト・macOS ターゲット）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo check -p backend-metal --tests --target aarch64-apple-darwin

  # --------------------------------------------------
  # CUDA toolkit 非搭載環境でのビルド・実行成立検証（TASK-1.7d・イシュー #35／
  # TASK-2.3・イシュー #56）。
  # scripts/check-cuda-toolkit-absent.sh（Makefile の build-no-cuda ターゲットと共用する
  # 単一ソース）で「toolkit 非搭載であること自体」を fail-closed で検証したうえで
  # cargo build を実行する。runner に将来 toolkit が導入された場合はこのジョブが失敗し、
  # コンテナ内検証への切替が必要になったことを検知できる。
  #
  # TASK-2.3 は spec 上「cuda feature を含まない構成」の検証を求めるが、backend-cuda は
  # TASK-2.1（#48）で正式化した feature フラグなしの cfg ベース構成（PoC-v2-5）を採用して
  # おり feature 分岐自体が存在しないため、「CUDA toolkit 非搭載環境でのビルド・実行成立」
  # に読み替える（spec 自体が PoC-v2-3 の動的ロード方式に基づくと明記しており検証実体は
  # 一致する。docs/spec/ は編集しない）。
  #
  # 実行検証（cargo test）は既存 test ジョブ（TASK-1.7〜1.9d）と責務が異なる: test ジョブは
  # runner の toolkit 搭載状況を assert しないため、runner に toolkit が導入されると
  # 「非搭載環境での実行成立」の検証が暗黙に消える（#35 がビルドに対して解決したのと同型の
  # 問題の実行版）。本ジョブは上記 assert 済みの前提下で cargo test を実行することで、
  # cudarc の dynamic-loading 経由で CudaDevice::is_available() が false に縮退し、
  # CudaError::DriverUnavailable へ型付きエラーとして落ちる分岐（panic しない契約）と、
  # backend-cpu・tensor-core を含む workspace 全体の実行成立を担保する。
  # --------------------------------------------------
  build-no-cuda-toolkit:
    name: cargo build / test (CUDA toolkit 非搭載検証)
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。ubuntu-latest
    # 標準イメージは CUDA toolkit 非搭載であり、本ジョブが検証する前提
    # （scripts/check-cuda-toolkit-absent.sh assert）と自然に合致する。
    runs-on: ubuntu-latest
    # test ステップ追加により既存 test ジョブの上限（45 分）に整合させる。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行を、実環境の toolkit 有無に関わらず常時検出する
      # （deps-forbidden ジョブと同一方針）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-cuda-toolkit-absent.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため cargo build（toolkit 非搭載検証）をスキップしました（workspace 作成後に有効化されます）"
          fi

      # fail-closed: runner に toolkit が導入されていれば「非搭載環境での検証」という
      # 本ジョブの前提が成立しないため、cargo build の前に明示的に失敗させる。
      - name: CUDA toolkit 非搭載の検証
        run: bash scripts/check-cuda-toolkit-absent.sh assert

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（build ジョブと同一方針。本ファイル冒頭コメント参照）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@39d6d5cfd275338ec2e4bcead179b6a017712772 # main

      # cargo registry（3 ジョブ共通・本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # target（build-no-cuda-toolkit ジョブ専用。本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo target
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: target-build-no-cuda-toolkit-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            target-build-no-cuda-toolkit-${{ runner.os }}-

      - name: cargo build（toolkit 非搭載）
        if: steps.detect.outputs.has_cargo == 'true'
        # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する（build ジョブと同一方針）。
        run: cargo build --workspace --locked

      # TASK-2.3（#56）: assert 済みの toolkit 非搭載前提下で非 #[ignore] テストを実行し、
      # 「ビルド成立」だけでなく「実行成立」（DriverUnavailable への型付きエラー縮退・
      # backend-cpu 経由の演算実行を含む）を検証する。実機必須テストは #[ignore] 分離済み
      # のため非搭載 runner でも green になる設計（.claude/rules/coding-rust.md）。
      - name: cargo test（toolkit 非搭載）
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace --locked

  # --------------------------------------------------
  # 依存禁止リストの機械検査（TASK-1.2・REQ-1）。
  # Cargo.lock を対象に、禁止クレート（burn 系一式・cubecl・candle・tch・ndarray。
  # .claude/rules/deps-policy.md）が推移的依存を含めて混入していないことを検査する。
  # cargo 不要（grep のみ）のため rustup セットアップは行わない。
  # --------------------------------------------------
  deps-forbidden:
    name: forbidden dependencies check
    # public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #466）。
    runs-on: ubuntu-latest
    # cargo tree 検査（cargo フェッチ・解決を伴う）を追加したため 10 → 15 に引き上げる。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（正規表現の破損・grep 消失等）を、実データの有無に関わらず
      # 常時検出する（受け入れ条件「禁止クレート混入時に fail-closed で失敗する」の機械検証。
      # scripts/check-forbidden-deps.sh self-test）。cargo 不要のため無条件実行する。
      - name: 検査ロジックの self-test
        run: bash scripts/check-forbidden-deps.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cargo.lock の依存禁止検査
        run: |
          set -euo pipefail
          if [ ! -f "Cargo.lock" ]; then
            echo "::notice::Cargo.lock が未追加のため依存禁止検査をスキップしました（workspace 作成後に有効化されます）"
            exit 0
          fi
          bash scripts/check-forbidden-deps.sh lock Cargo.lock

      # ubuntu-latest は rustup プリインストール済みのため実質 no-op で通過し、
      # rust-toolchain.toml へ同期する（build ジョブと同一方針。本ファイル冒頭コメント参照）。
      - name: Rust toolchain setup（rust-toolchain.toml 同期）
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@39d6d5cfd275338ec2e4bcead179b6a017712772 # main

      # cargo registry のみ（cargo tree は依存解決・フェッチのみでビルドしないため target
      # キャッシュは不要。本ファイル冒頭コメントのキャッシュ設計参照）。
      - name: Cache cargo registry
        if: steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: cargo tree の依存禁止検査
        # Cargo.lock の grep 検査を補強し、cargo tree の依存解決結果（features・build
        # 依存・cfg(target_os = "macos") 限定の Metal 系依存を含む）に対しても検査する
        # （TASK-1.2 の成果物「cargo tree 出力の禁止クレート grep 検査」）。
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/check-forbidden-deps.sh tree

  # --------------------------------------------------
  # guardrail 判定器の 2 層検証（TASK-6.1a・イシュー #147）。
  # REQ-4（1 層目・判定器単体）・REQ-5（2 層目・除外適用後）の回帰テストを
  # scripts/run-guardrail-regression.sh 経由で実行する（本ファイル冒頭コメント参照）。
  # --------------------------------------------------
  guardrail-regression:
    name: guardrail 2 層検証（REQ-4/REQ-5）
    runs-on: self-hosted
    # guardrail クレート単体のビルド・テストのみのため、test ジョブ（45 分）より短く設定する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（テストファイル・fixture の無言削除／リネーム）を、
      # 実行環境の cargo 有無に関わらず常時検出する（deps-forbidden ジョブと同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/run-guardrail-regression.sh self-test

      # guardrail-regression-schedule.yml の report ジョブが使う報告ロジック
      # （scripts/report-guardrail-schedule-result.sh）自体の退行を、schedule 発火を
      # 待たず push/PR 契機で常時検知する（TASK-6.1b・#148。ネットワーク不要・cargo 不要）。
      - name: schedule 結果報告ロジックの self-test
        run: bash scripts/report-guardrail-schedule-result.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため guardrail 2 層検証をスキップしました（workspace 作成後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: 1 層目（REQ-4・判定器単体）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer1

      - name: 2 層目（REQ-5・除外適用後）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-guardrail-regression.sh layer2

  # --------------------------------------------------
  # AI 自律メンテナンス検証ゲート（build/test/clippy。TASK-6.1c・イシュー #199）。
  # scripts/run-verification-gates.sh（Makefile の verification-gates ターゲットと共用
  # する単一ソース）経由で self-test → build → test → clippy を直列実行する
  # （本ファイル冒頭コメント参照）。bench ゲートは verification-gate-bench.yml
  # （schedule／workflow_dispatch）に分離する。
  # --------------------------------------------------
  verification-gates:
    name: 検証ゲート（build/test/clippy）
    runs-on: self-hosted
    # test サブコマンドが --release を使うため、既存 test ジョブ（45 分）と同等以上を確保する。
    timeout-minutes: 60
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # 検査ロジック自体の退行（bench ワークロード example の無言削除・リネーム）を、
      # 実行環境の cargo 有無に関わらず常時検出する（deps-forbidden ジョブと同一方針）。
      - name: 検査ロジックの self-test
        run: bash scripts/run-verification-gates.sh self-test

      - name: Cargo.toml の有無を判定
        id: detect
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が未追加のため検証ゲートをスキップしました（workspace 作成後に有効化されます）"
          fi

      - name: Ensure rustup is installed
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Sync toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        run: rustup show

      - name: Ensure clippy component
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          set -euo pipefail
          rustup component list --installed | grep -q '^clippy' || rustup component add clippy

      - name: ゲート 1/3（build）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh build

      - name: ゲート 2/3（test --release）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh test

      - name: ゲート 3/3（clippy）
        if: steps.detect.outputs.has_cargo == 'true'
        run: bash scripts/run-verification-gates.sh clippy

  # --------------------------------------------------
  # 集約ジョブ（branch protection の required status check はこのジョブのみを指定する）。
  # bare needs は skipped も success 扱いになるため、明示的に result を検査して
  # fail-closed で判定する（.claude/rules/ci.md）。
  # --------------------------------------------------
  ci-complete:
    name: ci-complete
    runs-on: self-hosted
    # 判定のみのジョブのため権限は一切不要（workflow レベルの contents: read も継承しない）。
    permissions: {}
    # 失敗・スキップ時にも必ず実行して fail-closed で判定する。
    if: ${{ always() }}
    # ジョブを追加したら必ずこの needs（および下の完遂判定の検査対象）へ追加する。
    needs: [rust-ci, build, build-no-cuda-toolkit, deps-forbidden, guardrail-regression, verification-gates]
    timeout-minutes: 5
    steps:
      - name: 完遂判定（全 needs ジョブが success であること）
        env:
          # rust-ci は reusable workflow 呼び出しのため、result は共通側の全ジョブ
          # （fmt / clippy / test / deny / rust-base-ci-complete）を集約した結果になる
          RESULT_RUST_CI: ${{ needs.rust-ci.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_BUILD_NO_CUDA_TOOLKIT: ${{ needs.build-no-cuda-toolkit.result }}
          RESULT_DEPS_FORBIDDEN: ${{ needs.deps-forbidden.result }}
          RESULT_GUARDRAIL_REGRESSION: ${{ needs.guardrail-regression.result }}
          RESULT_VERIFICATION_GATES: ${{ needs.verification-gates.result }}
        run: |
          set -euo pipefail
          ok=1
          for pair in "rust-ci:${RESULT_RUST_CI}" "build:${RESULT_BUILD}" "build-no-cuda-toolkit:${RESULT_BUILD_NO_CUDA_TOOLKIT}" "deps-forbidden:${RESULT_DEPS_FORBIDDEN}" "guardrail-regression:${RESULT_GUARDRAIL_REGRESSION}" "verification-gates:${RESULT_VERIFICATION_GATES}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "NG: ${name} = ${result}"
              ok=0
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "一部ジョブが success ではありません" >&2
            exit 1
          fi
          echo "全ジョブ success"
