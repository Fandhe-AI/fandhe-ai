# 外部ソース（docs/spec サブモジュール・エージェントスキル）の自動追従ワークフロー。
#
# 実装本体は Fandhe-AI/actions の reusable workflow
# `.github/workflows/update-external.yml`（Fandhe-AI/agent-cli-skills イシュー #259 で
# reusable 化）。本ファイルはリポジトリ固有の設定だけを持つ薄い wrapper であり、
# fail-closed ガード・`persist-credentials`・`source-token`・外部 action の pin・
# Node / skills CLI の版数は共通側で集中管理される。
#
# 移行前は 145 行のテンプレートを本リポジトリで手管理していた。上流の強化
# （skills ジョブの `persist-credentials: false`、`source-token` の明示、
# `auto-merge-immediate-fallback: 'false'`、Node 20 → 24.19.0）は
# `.github/workflows/**` が skills-update の配布対象外であるため届いておらず、
# 本 wrapper への移行で一括して適用される。
#
# runs-on: public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #468）で
# self-hosted から ubuntu-latest へ変更した。組織 runner 方針の public 側適用
# （.claude/rules/ci.md『runner』節）に従う。移行後は runner-json input で指定する。
#
# docs/spec は private 維持方針（#463。2026-08-14 決定）。本リポジトリを public 化した
# 後も docs/spec 自体は private のまま残るため、submodule の取得には org secret
# SUBMODULE_PAT（visibility=all）が実効的な経路となる。共通側は PAT 未設定時に
# GITHUB_TOKEN へフォールバックせず fail-closed で停止する（bot 作成 PR が
# pull_request workflow を発火させず必須チェック未実行で恒久 BLOCKED になる事故の回避）。
name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象（手動実行時のみ有効。schedule は常に all）'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  update-external:
    # Fandhe-AI/actions はタグ未公開のため main 追従の最新コミット SHA に固定する
    uses: Fandhe-AI/actions/.github/workflows/update-external.yml@0655187f7c71aafbe94098f7613d2cea1876e29f # main
    permissions:
      contents: read
    with:
      # schedule 起動では inputs が null になるため all へフォールバックする
      target: ${{ inputs.target || 'all' }}
      # public リポジトリのため GitHub ホステッドランナーを使う（上記 runs-on の注記参照）。
      # 必ず JSON リテラルで指定する（素の ubuntu-latest は fromJSON が失敗する）。
      runner-json: '"ubuntu-latest"'
      # auto-merge はマージ可否を左右する設定のため、組織変数を呼び出し側で解決して渡す。
      # 未設定（null/空）を有効と解釈する composite action の非対称設計に合わせ、
      # 明示的に 'false' へフォールバックしオプトイン運用とする。
      submodule-auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
      submodule-auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
      skills-auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
      skills-auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
    secrets:
      # SKILLS_PAT は未登録のため空文字となり、共通側が SUBMODULE_PAT へフォールバックする。
      SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
      SKILLS_PAT: ${{ secrets.SKILLS_PAT }}
