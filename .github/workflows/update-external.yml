# 外部ソース（docs/spec サブモジュール・エージェントスキル）の自動追従ワークフロー。
#
# Fandhe-AI/fandhe-multi-platform の update-external.yml と同一方針
# （permissions 最小・Fandhe-AI/actions の共通アクション利用）。本リポジトリは
# 更新対象が「docs/spec（Fandhe-AI/rust-ai-library-spec サブモジュール）」
# 「.claude/skills 配下のエージェントスキル（skills-lock.json 管理）」の 2 種のみで、
# 参考リポジトリの submodule/skill ジョブ構成をそのまま適用できる（大きな読み替えなし）。
# Rust コード未実装（Cargo.toml なし）だが、本ワークフローは cargo を一切呼び出さないため
# Cargo.toml 存在チェックのガードは不要。
#
# runs-on: public 化に伴うホステッドランナー移行（#457 Phase 2・イシュー #468）で
# self-hosted から ubuntu-latest へ変更した（upstream との差分理由。.claude/rules/ci.md
# update-external.yml 節）。secrets 経路（SUBMODULE_PAT フォールバック）・permissions・
# persist-credentials・auto-merge 変数は本イシューでは不変（受け入れ条件）。
name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象（手動実行時のみ有効。schedule は常に all）'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # docs/spec サブモジュール参照の更新（Fandhe-AI/actions/submodule-update）
  # --------------------------------------------------
  submodule:
    name: Update submodule references
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "submodule"]'), inputs.target) }}
    runs-on: ubuntu-latest
    # ハングしたジョブが runner を無期限占有するのを防ぐため、多層防御として
    # timeout を必ず設定する。
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（参考リポジトリと同一 SHA に固定）。
        # 本ジョブは checkout 後に `git submodule update --remote --recursive`
        # （Fandhe-AI/actions/submodule-update 内、docs/spec は private リポジトリ）を
        # 実行するため、persist-credentials は既定（true）のまま維持する
        # （後続ステップの git 操作が認証情報を必要とするため）。
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意。
        # 下記 secrets.SUBMODULE_PAT 参照）。
        # docs/spec は private 維持方針（#463。2026-08-14 決定）。本リポジトリを
        # public 化した後も docs/spec 自体は private のまま残すため、GITHUB_TOKEN
        # フォールバックでは submodule を取得できなくなる。org secret
        # SUBMODULE_PAT（visibility=all で全リポジトリに供給）が実効的な取得経路であり、
        # public 化後もこの構成のまま機能する（#463 で org secret 実測確認済み）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # base-branch: main と整合させる。workflow_dispatch で main 以外の
          # ブランチから手動実行されても、更新 PR には main のツリーのみを焼き込む。
          ref: main
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Update submodules and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/submodule-update@fed9c07d98367f77e5e2b63bca38843f46feee96
        with:
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/submodule-update
          commit-message: 'chore: submodule を最新に更新'
          pr-title: 'chore: submodule を最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定（null/空）を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash

  # --------------------------------------------------
  # エージェントスキル（.claude/skills・skills-lock.json）の更新
  # （Fandhe-AI/actions/skills-update）
  # --------------------------------------------------
  skills:
    name: Update agent skills
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "skill"]'), inputs.target) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v6.0.3。
        # persist-credentials: false: skills-update の action.yml はソース取得を
        # `git config --global url."https://x-access-token:${FETCH_TOKEN}@github.com/".insteadOf`
        # による自前注入 + trap での破棄、push も `git remote set-url` + trap での復元で
        # 完結しており、checkout が既定で永続化する認証情報には依存していない
        # （submodule ジョブとは異なり、後続ステップが checkout の persist-credentials に
        # 依存しない）。よって不要な認証情報を .git/config に残さないよう無効化する。
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # base-branch: main と整合させる。workflow_dispatch で main 以外の
          # ブランチから手動実行されても、更新 PR には main のツリーのみを焼き込む。
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        # actions/setup-node v6.4.0。skills-update が使う npx skills のため node を固定する。
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Update skills and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/skills-update@fed9c07d98367f77e5e2b63bca38843f46feee96
        with:
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/skills-update
          commit-message: 'chore: エージェントスキルを最新に更新'
          pr-title: 'chore: エージェントスキルを最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定（null/空）を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash
